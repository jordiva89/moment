/* ===== Importación de prácticas: Word (.docx), texto amigable y JSON ===== */
// Formato amigable: cada práctica empieza con «Título:»; «Categoría:» y «Enlace:» son
// opcionales; «Texto:» puede continuar en varias líneas hasta una línea en blanco.
/* ---- Prefijos que reconoce el lector de plantillas ----
   Antes estaban fijos en español e inglés: una plantilla rellenada en otro idioma
   no se leía y la app decía «no se encontraron prácticas». Ahora los prefijos se
   sacan de TODOS los idiomas cargados —incluidos los importados—, usando las
   mismas claves con las que se genera la plantilla (fmt_title, fmt_cat…). */
let _prefijos = null;
function prefijosCampos(){
  if(_prefijos) return _prefijos;
  const base = {
    titulo: ['t[ií]tulo','title'],
    cat:    ['categor[ií]a','category','cat'],
    texto:  ['texto','text'],
    enlace: ['enlace','link','url'],
  };
  try{
    const claves = {titulo:'fmt_title', cat:'fmt_cat', texto:'fmt_text', enlace:'fmt_link'};
    Object.keys(I18N).forEach(lang=>{
      Object.entries(claves).forEach(([campo, clave])=>{
        const v = I18N[lang] && I18N[lang][clave];
        if(!v) return;
        const p = String(v).replace(/\s*:\s*$/,'').trim();
        if(p && !base[campo].includes(p)) base[campo].push(p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
      });
    });
  }catch(e){ anota('prefijos-plantilla', e); }
  _prefijos = base;
  return base;
}
/* ¿El prefijo leído corresponde a este campo, en cualquier idioma? */
function esCampo(campo, leido){
  const norm = x => String(x).toLowerCase().replace(/\\/g,'').replace(/[\[\]]/g,'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const k = norm(leido);
  return prefijosCampos()[campo].some(p => {
    const s = norm(p);
    // los de la lista base son expresiones (t[ií]tulo): se prueban como tal
    try{ return new RegExp('^(?:'+p+')$','i').test(leido) || s===k; }catch(e){ return s===k; }
  });
}
function rePrefijos(){
  const p = prefijosCampos();
  const todos = [].concat(p.titulo, p.cat, p.texto, p.enlace).join('|');
  return new RegExp('^\\s*(' + todos + ')\\s*:\\s*(.*)$', 'i');
}
/* Al añadir un idioma, los prefijos se recalculan. */
function olvidarPrefijos(){ _prefijos = null; }
function parseFriendlyPracticas(txt){
  const out=[]; let cur=null, modo=null;
  txt.split(/\r?\n/).forEach(l=>{
    // Se aceptan las etiquetas en los dos idiomas y sus abreviaturas. «category»
    // faltaba: la plantilla en inglés la usa y sus categorías se perdían al importar.
    const m=l.match(rePrefijos());
    if(m){
      const k=m[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      const v=m[2].trim(); modo=null;
      if(esCampo('titulo', k)){ if(cur) out.push(cur); cur={title:v}; }
      else if(!cur){ /* claves antes del primer Título: se ignoran (instrucciones) */ }
      else if(esCampo('cat', k)){ cur.cat=v; }
      else if(esCampo('enlace', k)){ cur.link=v; }
      else { cur.text=v; modo='text'; }
    }
    else if(cur && modo==='text'){
      if(l.trim()==='') modo=null;
      else cur.text=(cur.text?cur.text+'\n':'')+l.trim();
    }
  });
  if(cur) out.push(cur);
  return out.filter(p=>p.title && (p.text||p.link));
}
// Lector mínimo de .docx: localiza word/document.xml dentro del ZIP y extrae el texto.
async function docxToText(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let e=-1;
  for(let i=u8.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error('zip');
  const nEnt=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true), target=null;
  for(let k=0;k<nEnt;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true),
          nlen=dv.getUint16(p+28,true), xlen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
          lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+nlen));
    if(name==='word/document.xml'){ target={method,csize,lho}; break; }
    p+=46+nlen+xlen+clen;
  }
  if(!target) throw new Error('docx');
  const q=target.lho, n2=dv.getUint16(q+26,true), x2=dv.getUint16(q+28,true);
  const data=u8.slice(q+30+n2+x2, q+30+n2+x2+target.csize);
  let xmlBytes=data;
  if(target.method===8){
    const ds=new DecompressionStream('deflate-raw');
    xmlBytes=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer());
  }
  let xml=new TextDecoder().decode(xmlBytes);
  xml=xml.replace(/<w:tab[^>]*\/>/g,' ').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'');
  return xml.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");
}
/* ===== Plantilla en Word (.docx) generada por la propia app ===== */
function crc32(u8){
  let t=crc32.t;
  if(!t){ t=crc32.t=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } }
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=t[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){ // ZIP sin compresión: suficiente y sin dependencias
  const te=new TextEncoder(), parts=[], cd=[]; let ofs=0;
  const u16=v=>new Uint8Array([v&255,(v>>8)&255]);
  const u32=v=>new Uint8Array([v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255]);
  files.forEach(f=>{
    const name=te.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const loc=[u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(name.length),u16(0),name,f.data];
    cd.push({name,crc,sz,ofs});
    loc.forEach(x=>{ parts.push(x); ofs+=x.length; });
  });
  const cdStart=ofs; let cdLen=0;
  cd.forEach(f=>{
    const rec=[u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(f.crc),u32(f.sz),u32(f.sz),u16(f.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(f.ofs),f.name];
    rec.forEach(x=>{ parts.push(x); cdLen+=x.length; });
  });
  [u32(0x06054b50),u16(0),u16(0),u16(cd.length),u16(cd.length),u32(cdLen),u32(cdStart),u16(0)].forEach(x=>parts.push(x));
  const total=parts.reduce((a,x)=>a+x.length,0), out=new Uint8Array(total);
  let o=0; parts.forEach(x=>{ out.set(x,o); o+=x.length; });
  return out;
}
function PLANTILLA_LINEAS(){ return getLang()==='en'?PLANTILLA_LINEAS_EN:PLANTILLA_LINEAS_ES; }
function plantillaDocxBytes(){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const body=PLANTILLA_LINEAS().map(l=>`<w:p><w:r><w:t xml:space="preserve">${esc(l)}</w:t></w:r></w:p>`).join('');
  const te=new TextEncoder();
  return zipStore([
    {name:'[Content_Types].xml', data:te.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>')},
    {name:'_rels/.rels', data:te.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>')},
    {name:'word/document.xml', data:te.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'</w:body></w:document>')},
  ]);
}
const MIME_DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
function bytesABase64(bytes){
  let bin='';
  for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+8192));
  return btoa(bin);
}

async function compartirBytes(nombre, b64, mime, titulo){

// Valida y aplica una copia. Devuelve true si se aplicó.
function aplicarCopia(obj){
  if(!obj || obj.app!=='momento-para-ti' || typeof obj.data!=='object' || !obj.data) return false;
  const claves=Object.keys(obj.data).filter(k=>k.startsWith('mpt_'));
  if(!claves.length) return false;
  // retirar las claves mpt_ actuales para no dejar restos de la instalación previa
  const actuales=[];
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith('mpt_')) actuales.push(k); }
  actuales.forEach(k=>{ try{localStorage.removeItem(k);}catch(e){} });
  claves.forEach(k=>{ try{localStorage.setItem(k, String(obj.data[k]));}catch(e){} });
  return true;
}
function importarDatosTexto(txt){
  let obj=null;
  try{ obj=JSON.parse(txt); }catch(e){ toast(t('bk_bad')); return false; }
  if(!obj || obj.app!=='momento-para-ti'){ toast(t('bk_bad')); return false; }
  if(!confirm(t('bk_confirm'))) return false;
  if(!aplicarCopia(obj)){ toast(t('bk_bad')); return false; }
  toast(t('bk_done'));
  setTimeout(()=>{ try{location.reload();}catch(e){} }, 900);
  return true;
}

// Firma de los ejemplos que trae la plantilla, calculada de la propia plantilla:
// si el usuario la sube sin tocarlos, se descartan. Si edita uno, deja de coincidir
// y sí se importa (ya es suyo). La lista se mantiene sola al cambiar la plantilla.
let _firmasEjemplo=null;
function firmaPractica(p){ return ((p.title||'')+'|'+(p.text||'')).replace(/\s+/g,' ').trim().toLowerCase(); }
function esEjemploPlantilla(p){
  // Los ejemplos de la plantilla se reconocen en AMBOS idiomas, independientemente
  // del idioma activo: cubre el caso de descargar la plantilla en un idioma y
  // subirla con la app en el otro.
  if(!_firmasEjemplo) _firmasEjemplo=parseFriendlyPracticas(PLANTILLA_LINEAS_ES.join('\n'))
    .concat(parseFriendlyPracticas(PLANTILLA_LINEAS_EN.join('\n'))).map(firmaPractica);
  return _firmasEjemplo.includes(firmaPractica(p));
}
function addImportedPracticas(arr){
  let n=0, ejemplos=0; const base=Date.now();
  (arr||[]).forEach((it,k)=>{
    if(!it || !it.title || (!it.text && !it.link)) return;
    if(esEjemploPlantilla(it)){ ejemplos++; return; }
    const p={id:'u'+(base+k), cat:(it.cat||'Importadas'), title:String(it.title),
             text:String(it.text||t('default_link_text'))};
    if(it.link) p.link=String(it.link);
    userLib.push(p); n++;
  });
  if(!n){
    toast(ejemplos ? t('im_only_examples') : t('im_none'));
    return;
  }
  LS.set('mpt_userlib', userLib); libCacheDirty();
  LS.set('mpt_plans', {});
  scheduleNext();
  closeModal(); renderLib();
  toast(t('im_added').replace('{n}',n));
  const nuevas=userLib.slice(-n);
  if(confirm(t('cf_send_import').replace('{x}', n===1?t('cf_send_1'):t('cf_send_n').replace('{n}',n)))){
    enviarPracticasEmail(nuevas);
  }
}
function enviarPracticasEmail(lista){
  const cuerpo=lista.map(p=>{
    let t=window.t('fmt_title')+p.title+'\n'+window.t('fmt_cat')+p.cat+'\n'+window.t('fmt_text')+p.text;
    if(p.link) t+='\nEnlace: '+p.link;
    return t;
  }).join('\n\n');
  const asunto=lista.length===1 ? t('sh_mail_sub1')+lista[0].title
                                 : t('sh_mail_subn').replace('{n}', lista.length);
  const intro=lista.length===1 ? t('sh_mail_1') : t('sh_mail_n');
  const cuerpoMail=t('sh_mail_hi')+'\n\n'+intro+'\n\n'+cuerpo+'\n\n'+t('sh_mail_bye');
  location.href='mailto:'+METRICS_EMAIL+'?subject='+encodeURIComponent(asunto)+'&body='+encodeURIComponent(cuerpoMail);
}
function importPracticesFile(file){
  if(!file) return;
  if(/\.docx$/i.test(file.name||'')){
    // documento Word: se extrae el texto y se interpreta el formato de la plantilla
    file.arrayBuffer()
      .then(docxToText)
      .then(txt=>addImportedPracticas(parseFriendlyPracticas(txt)))
      .catch(()=>toast(t('ts_docx_fail')));
    return;
  }
  const r=new FileReader();
  r.onload=()=>{
    try{
      let txt=String(r.result).trim();
      // 1º se intenta como JSON (admite también un practices.js exportado);
      // 2º como texto con el formato de la plantilla (Título:/Categoría:/Texto:)
      let arr=null;
      const i=txt.indexOf('['), j=txt.lastIndexOf(']');
      if(i>=0 && j>i){ try{ const a=JSON.parse(txt.slice(i, j+1)); if(Array.isArray(a)) arr=a; }catch(e){} }
      if(!arr) arr=parseFriendlyPracticas(txt);
      addImportedPracticas(arr);
    }catch(e){ toast(t('ts_json_fail')); }
  };
  r.readAsText(file);
}

function eneagramaSVG(size, color){
  // puntos 1..9 sobre el círculo, con el 9 arriba (ángulo 90°), cada 40°
  const cx=100, cy=100, r=88;
  const pt=i=>{ const a=(90 - i*40) * Math.PI/180; return [cx + r*Math.cos(a), cy - r*Math.sin(a)]; };
  const P={}; for(let i=1;i<=9;i++) P[i]=pt(i);
  const line=(a,b)=>`M${P[a][0].toFixed(1)},${P[a][1].toFixed(1)} L${P[b][0].toFixed(1)},${P[b][1].toFixed(1)}`;
  const tri=[[9,3],[3,6],[6,9]].map(x=>line(x[0],x[1])).join(' ');
  const hex=[[1,4],[4,2],[2,8],[8,5],[5,7],[7,1]].map(x=>line(x[0],x[1])).join(' ');
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" style="display:block;margin:0 auto" aria-label="Eneagrama">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="3"/>
    <path d="${tri}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
    <path d="${hex}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

async function refreshBgEstado(force){

  if(!force && Date.now()-_bgCheckT<4000){

    } else {

  if(IS_NATIVE && CapLN){

      <div class="optgrid">${[1,2,3].map(h=>`<button class="optbtn ${cfg.freq===h?'sel':''}" onclick="cfg.freq=${h};ajustarSpan();applyCfg()">${t('pt_each_btn')} ${h} h</button>`).join('')}</div>

      <p class="muted" style="margin:0 0 8px">${t('pt_span_txt')}</p>
      <div class="optgrid g7">${spanOpciones().map(h=>`<button class="optbtn ${cfg.span===h?'sel':''}" onclick="cfg.span=${h};applyCfg()">${h} h</button>`).join('')}</div>
      <label class="fld">${t('pt_fav_label_a')} <b id="favN">${cfg.favPerDay}</b> ${t('pt_fav_label_b')} ${slotTimes().length} ${t('pt_fav_label_c')}</label>

      <input type="range" class="favrange" list="favticks" min="0" max="${slotTimes().length}" step="1" value="${cfg.favPerDay}"
        oninput="document.getElementById('favN').textContent=this.value"
        onchange="cfg.favPerDay=parseInt(this.value);applyCfg()">
      <datalist id="favticks">${Array.from({length:slotTimes().length+1},(_,k)=>`<option value="${k}"></option>`).join('')}</datalist>
      <label class="fld">${t('pt_const_label')}</label>
      <p class="muted" style="margin:0 0 8px">${t('pt_const_txt')}</p>
      <label class="chkrow">
        <input type="checkbox" ${cfg.constNo?'checked':''} onchange="cfg.constNo=this.checked;if(this.checked){cfg.constIni=false;cfg.constMed=false;cfg.constFin=false;}applyCfg()"> ${t('pt_const_no')}
      </label>
      <label class="chkrow">
        <input type="checkbox" ${cfg.constIni?'checked':''} onchange="cfg.constIni=this.checked;if(this.checked)cfg.constNo=false;applyCfg()"> ${t('pt_const_ini')}
      </label>
      <label class="chkrow">
        <input type="checkbox" ${cfg.constMed?'checked':''} onchange="cfg.constMed=this.checked;if(this.checked)cfg.constNo=false;applyCfg()"> ${t('pt_const_med')}
      </label>
      <label class="chkrow">
        <input type="checkbox" ${cfg.constFin?'checked':''} onchange="cfg.constFin=this.checked;if(this.checked)cfg.constNo=false;applyCfg()"> ${t('pt_const_fin')}
      </label>
      <label class="fld">${t('pt_vis_label')}</label>
      <p class="muted" style="margin:0 0 8px">${t('pt_cats_txt')}</p>
      <label class="chkrow" style="margin:0 0 6px">
        <input type="checkbox" ${cfg.visDia?'checked':''} onchange="cfg.visDia=this.checked;applyCfg()"> ${t('pt_vis_chk')}
      </label>
      ${catPairs().filter(cp=>cp.id!=='constelaciones').map(cp=>`<label class="chkrow" style="margin:0 0 6px">
        <input type="checkbox" ${cfg.catsPref && cfg.catsPref[cp.id]?'checked':''} onchange="setCatPref(${JSON.stringify(cp.id).replace(/"/g,'&quot;')}, this.checked)"> ${cp.propia?esc(cp.id):esc(catLabel(cp.id))}
      </label>`).join('')}

      <label class="fld">${t('pt_esp_label')}</label>
      <p class="muted" style="margin:0 0 8px">${t('pt_esp_txt')}</p>
      ${especialesLista().map(p=>`<button class="btn ghost block" style="text-align:left" onclick="crearMomentoDe('${p.id}')">⏰ ${esc(p.title)}</button>`).join('')}
      <label class="fld">${t('pt_moments_label')}</label>
      <p class="muted" style="margin:0 0 8px">${t('pt_moments_txt')}</p>
      ${userEvents.length?userEvents.map(ev=>`
        <div style="display:flex;align-items:center;gap:10px;font-size:.92rem;margin-bottom:8px">
          <div style="flex:1"><b>${esc(ev.title)}</b> · ${evTimesText(ev)} · ${repFullText(ev)}</div>
          <button class="pau ${evPaused.includes(ev.id)?'on':''}" onclick="toggleEventPause('${ev.id}')" title="${evPaused.includes(ev.id)?t('pause_remove_t'):t('pause_add_t')}">⏸</button>
          <button class="pau" onclick="openEventForm('${ev.id}')" title="${t('mo_edit')}" style="opacity:1;filter:none;color:var(--verde2)">✏️</button>
          <button class="pau" onclick="delEvent('${ev.id}')" title="${t('mo_delete')}" style="color:#B3402A;opacity:1;filter:none">🗑</button>
        </div>`).join(''):`<p class="muted">${t('mo_none')}</p>`}
      <label class="chkrow" style="margin:10px 0 6px">
        <input type="checkbox" ${cfg.soloEventos?'checked':''} onchange="cfg.soloEventos=this.checked;applyCfg()"> ${t('pt_only_own')}
      </label>

      <button class="btn gold block" onclick="openEventForm()">${t('pt_create')}</button>
      <div class="infobox" style="margin-top:12px">💡 <b>${t('ob_hint_title')}:</b> ${t('ob_hint_custom')}</div>
    `)}
    ${secAjustes('share', t('set_share'), `
      <p class="muted">${t('sr_intro')}</p>
      <button class="btn primary block" onclick="shareApp(getLang()==='en'?'the world':'el mundo')">${t('sr_world')}</button>
      <button class="btn ghost block" onclick="copyText(shareMsg()).then(ok=>toast(ok?t('sr_copied'):t('sr_copy_fail')))">${t('sr_copy')}</button>
      <p class="muted" style="margin-top:8px;font-size:.8rem">${t('sr_wa')}</p>
            <p class="muted" style="font-size:.8rem;margin-top:10px">${t('sr_trust')}</p>
    `)}
    ${secAjustes('stats', t('set_stats'), `
      ${(function(){ const r=statsResumen(); return `
      <p class="muted"><b>${t('st_last_conn')}</b> ${fmtFecha(stats.lastOpen)}<br>
      <b>${t('st_last_done')}</b> ${fmtFecha(stats.lastDone)}</p>
      <p class="muted"><b>${t('st_pattern')}</b> ${slotTimes().length} ${t('st_pattern_a')} ${pad(cfg.startH)}:${pad(cfg.startM)} ${t('st_pattern_b')} ${cfg.freq} ${t('st_pattern_c')} ${cfg.span} ${t('st_pattern_d')}</p>
      <p class="muted"><b>${t('st_last_days_a')} ${r.dias||0} ${t('st_last_days_b')}</b> ${r.h} ${t('st_done')} · ${r.extra} ${t('st_extra')} · ${r.pPract} ${t('st_snoozed_a')} (${r.pVeces} ${t('st_snoozed_b')})</p>
      <p class="muted"><b>${t('st_top_slots')}</b> ${r.topHoras.length?r.topHoras.join(', '):'—'}</p>
      <p class="muted"><b>${t('st_top_disc')}</b> ${r.topCamb.length?r.topCamb.map(c=>c.t+' ('+c.n+')').join(' · '):'—'}</p>
      <p class="muted">${t('st_last_send')} ${fmtFecha(stats.lastSend)}</p>`; })()}
      <p class="center cbtn"><button type="button" class="tbtn" onclick="sendMetrics()">${t('st_send_metrics')}</button></p>
      <p class="muted" style="margin-top:14px">${t('st_feedback_txt')}</p>
      <button class="btn ghost block" onclick="enviarFeedback()">${t('st_feedback_btn')}</button>
      <p class="center cbtn" style="margin-top:14px"><button type="button" class="tbtn peligro" onclick="openResetStats()">${t('st_reset')}</button></p>
    `)}
    ${secAjustes('cuenta', t('set_privacy'), `
      <label class="fld">${I18N.es.priv_language} · ${I18N.en.priv_language}</label>
      <p class="muted" style="margin:0 0 8px;font-size:.85rem">${t('id_txt')}</p>
      <div class="optgrid g2" style="margin-bottom:8px">
        ${idiomasDisponibles().map(c=>`<button class="optbtn ${getLang()===c?'sel':''}"
          onclick="setLang('${c}');renderSet()">${banderaIdioma(c)} ${esc(nombreIdioma(c))}</button>`).join('')}
      </div>
      ${idiomasDisponibles().filter(c=>!IDIOMAS_BASE.includes(c)).map(c=>`<p class="center cbtn" style="margin:0 0 6px">
        <button type="button" class="tbtn peligro" onclick="quitarIdioma('${c}')">${t('id_remove')}: ${esc(nombreIdioma(c))}</button></p>`).join('')}
      <input type="file" id="id_file" accept=".json,application/json" style="display:none"
        onchange="importarArchivo(this.files[0]);this.value=''">
      <button class="btn ghost block" onclick="document.getElementById('id_file').click()">${t('id_import')}</button>
      ${creditoIdioma()?`<p class="muted" style="margin:8px 0 0;font-size:.85rem">${t('cr_txt').replace('{n}', esc(creditoIdioma()))}</p>`:''}

      <label class="fld" style="margin-top:16px">${t('lb_label')}</label>
      <p class="muted" style="margin:0 0 8px;font-size:.85rem">${t('lb_txt')}</p>
      <div class="optgrid g2" style="margin-bottom:16px">
        <button class="optbtn ${langRespaldo()==='es'?'sel':''}" onclick="elegirRespaldo('es')">🇪🇸 Español</button>
        <button class="optbtn ${langRespaldo()==='en'?'sel':''}" onclick="elegirRespaldo('en')">🇬🇧 English</button>
      </div>
      <label class="fld">${t('ab_title')}</label>
      <p class="muted">${t('pr_intro')}</p>
      <p class="muted">${t('pr_astro')}</p>
      <button class="btn primary block" style="margin:12px 0" onclick="abrirFormularioSuscripcion()">${t('pr_subscribe')}</button>
      <p class="muted" style="font-size:.82rem;text-align:center">${t('pr_sub_txt')}</p>
      <p class="center cbtn" style="margin-top:12px"><button type="button" class="tbtn" onclick="verLegal('cond')">${t('pr_terms')}</button> · <button type="button" class="tbtn" onclick="verLegal('priv')">${t('pr_privacy')}</button></p>
      <label class="fld" style="margin-top:16px">${t('bk_title')}</label>
      <p class="muted">${t('bk_txt')}</p>
      <button class="btn ghost block" onclick="exportarDatos()">${t('bk_export')}</button>
      <input type="file" id="bk_file" accept=".json,application/json" style="display:none" onchange="importarArchivo(this.files[0]);this.value=''">
      <button class="btn ghost block" onclick="document.getElementById('bk_file').click()">${t('bk_import')}</button>
      <p class="muted" style="margin-top:16px">${t('pr_first_install')} <b>${fmtFecha(LS.get('mpt_install',0))}</b><br>
      ${t('pr_last_update')} <b>${fmtFecha(LS.get('mpt_update',0)||LS.get('mpt_install',0))}</b></p>
      <label class="chkrow" style="margin:0 0 10px">
        <input type="checkbox" checked onchange="if(!this.checked) desactivarAceptacion(); else this.checked=true;"> ${t('pr_accept_chk')}
      </label>
      <p class="muted" style="font-size:.85rem">${t('pr_accept_txt')}</p>
      <p class="muted" style="font-size:.85rem">${t('pr_titular')}</p>
      ${IS_NATIVE?`<label class="fld">${t('im_found')}</label>
      <p class="muted" style="margin:0 0 8px;font-size:.85rem">${t('im_found_txt')}</p>
      <div id="detectados"></div>
      <button class="btn ghost block" style="margin-bottom:16px" onclick="renderDetectados()">${t('im_scan')}</button>`:''}

      <label class="fld">${t('lg_label')}</label>
      <p class="muted" style="margin:0 0 8px;font-size:.85rem">${t('lg_txt')}</p>
      <pre style="background:#FFFDF7;border:1px solid #E2D7BF;border-radius:10px;padding:10px;
        font-size:.72rem;line-height:1.5;max-height:180px;overflow:auto;white-space:pre-wrap;margin:0 0 8px">${esc(logTexto())}</pre>
      ${_log.length?`<button class="btn small ghost" onclick="borrarLog()">${t('lg_clear')}</button>`:''}
      <p class="muted" style="margin-top:14px">${t('pr_version')} <b>v${APP_VERSION}</b></p>
      <p class="muted">${t('pr_upgrade')}</p>
      <p class="muted" style="margin-top:14px;font-size:.82rem">${t('pr_reset_warn')}</p>
      <p class="center cbtn"><button type="button" class="tbtn peligro" onclick="restaurarTodo()">${t('pr_reset')}</button></p>
    `)}
    <div class="card"><h2 style="margin:0 0 12px">${t('nc_social')}</h2>${ncSocialBlock()}</div>`;
}
function setTime(dh,dm){
  cfg.startH=(cfg.startH+dh+24)%24; cfg.startM=(cfg.startM+dm+60)%60;
  document.getElementById('vh').textContent=pad(cfg.startH);
  document.getElementById('vm').textContent=pad(cfg.startM);
  document.getElementById('clk').innerHTML=clockSVG(cfg.startH,cfg.startM,190);
  applyCfg(false);
}
function applyCfg(rerender=true){
  cfg.favPerDay=Math.min(cfg.favPerDay===undefined?1:cfg.favPerDay, slotTimes().length);
  LS.set('mpt_cfg',cfg);
  LS.set('mpt_plans', {});   // los días futuros se regeneran con el nuevo patrón
  dayState=null; ensureDayPlan(); scheduleNext();
  if(rerender) renderSet();
  toast(t('ts_pattern_upd'));
}
async function abrirAjusteExacto(){
  if(!IS_NATIVE) return;
  try{
    await CapLN.changeExactNotificationSetting();
    // al volver de los ajustes del sistema, re-verificar con reintentos
    refreshExactPerm(true);
    setTimeout(()=>refreshExactPerm(true), 800);
    setTimeout(()=>refreshExactPerm(true), 2500);
  }catch(e){ toast(t('ts_no_perm_needed')); }
}
async function testNotif(){
  if(!notifActive()){ toast(t('ts_enable_notif_first')); return; }
  const p=ALL()[Math.floor(Math.random()*ALL().length)];
  if(IS_NATIVE){
    const canal=await canalActual();
    CapLN.schedule({notifications:[{id:99999, title:t('app_title'),
      body:p.title+' — '+p.text.slice(0,80)+'…', channelId:canal, actionTypeId:'MPT',
      schedule:{at:new Date(Date.now()+4000), allowWhileIdle:true},
      extra:{pid:p.id, d:0, idx:-1, snoozes:0}}]}).catch(()=>{});
    toast(t('ts_test_4s'));
    return;
  }
  toast(t('ts_test_sent'));
  chime();
  const reg=await navigator.serviceWorker.getRegistration();
  if(reg) reg.showNotification(t('app_title'),{body:p.title+' — '+p.text.slice(0,80)+'…', icon:'icon-192.png', data:{id:p.id}, renotify:true, tag:'mpt-test', silent:false, vibrate:[120,60,120], actions:[{action:'snooze',title:t('notif_act_snooze')},{action:'open',title:t('notif_act_open')}]});
}

boot();
</script>
