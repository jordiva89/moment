<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Política de contenido: la app solo carga sus propios archivos y no puede
     conectarse por su cuenta a ningún servidor (ni peticiones, ni imágenes, ni
     marcos). Es la garantía técnica de «tus datos no salen de tu móvil»: aunque
     se colara código, el navegador le impediría enviar nada así. Abrir un
     enlace sigue funcionando, porque eso lo decide la persona.
     'unsafe-inline' hace falta porque los botones llevan su acción escrita en el
     HTML y porque Capacitor inyecta así su puente con Android. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B241C">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

</head>
