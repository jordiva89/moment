<script>
/* ================== ESTADO ================== */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v);}catch(e){return d} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ================== IDIOMA (i18n) ================== */
// Idioma: 'es' o 'en'. Se elige en el onboarding y se puede cambiar en Datos y privacidad.
// Si no se ha elegido aún, se intenta detectar del sistema (en → inglés; resto → español).
let LANG = LS.get('mpt_lang', null);
function detectLang(){
  // Se miran TODOS los idiomas preferidos del sistema, y las lenguas cooficiales
  // (catalán, gallego, euskera) cuentan como español: un móvil en catalán debe
  // arrancar en español, no en inglés.
  try{
    const ls=(navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||'es']);
    for(const l of ls){
      const c=(l||'').toLowerCase().slice(0,2);
      if(['es','ca','gl','eu'].includes(c)) return 'es';
      if(c==='en') return 'en';
    }
    return 'es';
  }catch(e){ return 'es'; }
}
function getLang(){ return LANG || detectLang(); }
function setLang(l){ LANG=l; LS.set('mpt_lang', l); try{ applyNavLang(); }catch(e){} try{ refreshPracticesLang(); }catch(e){} try{ sincronizarCanal(); }catch(e){} }
/* El diccionario I18N vive en i18n.js (se carga antes que este script) */
/* ---- Registro de incidencias ----
   Muchas operaciones (plugins nativos, avisos, almacenamiento) van envueltas en
   try/catch para que un fallo no tumbe la app. El problema es que fallaban en
   SILENCIO: el canal de alarma estuvo roto veinte versiones sin que se supiera.
   Ahora esos fallos quedan anotados aquí, se ven en Ajustes y viajan en el correo
   de diagnóstico. Solo se guardan los 40 últimos y nada sale del móvil. */
const LOG_MAX = 40;
let _log = [];
try{ _log = JSON.parse(localStorage.getItem('mpt_log') || '[]'); }catch(e){ _log = []; }
function anota(donde, err){
  try{
    const msg = (err && (err.message || err.name)) ? (err.message || err.name) : String(err||'');
    const ult = _log[_log.length-1];
    // no repetir la misma incidencia una y otra vez: se cuenta
    if(ult && ult.d===donde && ult.m===msg){ ult.n=(ult.n||1)+1; ult.t=Date.now(); }
    else _log.push({t:Date.now(), d:donde, m:msg.slice(0,140), n:1});
    if(_log.length>LOG_MAX) _log = _log.slice(-LOG_MAX);
    localStorage.setItem('mpt_log', JSON.stringify(_log));
  }catch(e){}
}
// Envuelve una operación que puede fallar sin que importe: si falla, queda anotada.
function intentar(donde, fn, porDefecto){
  try{ return fn(); }catch(e){ anota(donde, e); return porDefecto; }
}
function logTexto(){
  if(!_log.length) return t('lg_none');
  return _log.slice().reverse().map(x=>{
    const f=new Date(x.t);
    return pad(f.getDate())+'/'+pad(f.getMonth()+1)+' '+pad(f.getHours())+':'+pad(f.getMinutes())+
           '  '+x.d+': '+x.m+(x.n>1?'  (x'+x.n+')':'');
  }).join('\n');
}
function borrarLog(){ _log=[]; try{ localStorage.removeItem('mpt_log'); }catch(e){} toast(t('lg_cleared')); renderSet(); }
// cualquier error no capturado también queda anotado
window.addEventListener('error', e=>anota('js', e.error||e.message));
window.addEventListener('unhandledrejection', e=>anota('promesa', e.reason));
function t(key){ const l=getLang(); return (I18N[l] && I18N[l][key]) || I18N.es[key] || key; }
/* Idioma de respaldo de la biblioteca.
   Cuando un idioma no tenga todas las prácticas traducidas —caso normal en las
   traducciones aportadas por la comunidad— los textos que falten se muestran en
   este idioma en vez de dejar huecos. Español o inglés: los dos van dentro de la app. */
/* ============ Idiomas importados ============
   La app lleva dentro español e inglés. Los demás se descargan de la web como
   archivo JSON y se importan a mano desde Ajustes, igual que una copia de
   seguridad. Se guardan en el móvil y a partir de ahí funcionan sin conexión.

   El archivo es JSON, que se lee como DATOS y nunca se ejecuta: por eso una
   traducción de la comunidad no puede meter código en la app. */
const ESQUEMA_IDIOMA = 1;
const IDIOMAS_BASE = ['es','en'];          // los que van dentro y no se pueden quitar
let idiomasPropios = LS.get('mpt_idiomas', {});

/* Revisión del archivo antes de aceptarlo. Es la misma idea que
   tools/validar-idioma.js, resumida a lo que puede comprobarse aquí. */
function revisarIdioma(d){
  const fallos = [];
  if (!d || typeof d !== 'object') return [t('iv_formato')];
  if (!d.codigo || !/^[a-z]{2,3}(-[A-Za-z]{2,4})?$/.test(d.codigo)) fallos.push(t('iv_codigo'));
  if (IDIOMAS_BASE.includes(d.codigo)) fallos.push(t('iv_base'));
  if (d.esquema !== ESQUEMA_IDIOMA) fallos.push(t('iv_esquema'));
  if (!d.interfaz || typeof d.interfaz !== 'object') fallos.push(t('iv_interfaz'));
  if (!d.practicas || typeof d.practicas !== 'object') fallos.push(t('iv_practicas'));
  // nada de HTML ni enlaces en los textos
  const peligro = /<[a-z!/][^>]*>|javascript:/i;
  const revisar = o => Object.values(o||{}).some(v =>
    typeof v === 'string' ? peligro.test(v) : (v && peligro.test(String(v.t||'') + String(v.x||''))));
  if (revisar(d.interfaz) || revisar(d.practicas)) fallos.push(t('iv_html'));
  return fallos;
}

/* Incorpora un idioma guardado al diccionario y a la biblioteca. */
function activarIdioma(d){
  try{
    const c = d.codigo;
    // interfaz: lo que traiga, y lo que falte se resuelve solo con t() (cae a español)
    I18N[c] = Object.assign({}, d.fijos || {}, d.interfaz || {});
    if (d.practicas) TEXTOS[c] = d.practicas;
    if (d.categorias) CATEGORIAS.forEach(cat => { if (d.categorias[cat.id]) cat[c] = d.categorias[cat.id]; });
    if (typeof CREDITOS !== 'undefined' && d.autor) CREDITOS[c] = d.autor;
    return true;
  }catch(e){ anota('activar-idioma', e); return false; }
}
function cargarIdiomasPropios(){
  Object.values(idiomasPropios || {}).forEach(activarIdioma);
}
cargarIdiomasPropios();

/* Nombre visible de un idioma, para las listas. */
/* Bandera del idioma, para los selectores. Los idiomas importados declaran la
   suya en el archivo; si no, se usa un globo terráqueo. */
const BANDERAS = {es:'🇪🇸', en:'🇬🇧', fr:'🇫🇷', de:'🇩🇪', it:'🇮🇹', pt:'🇵🇹',
  ar:'🇸🇦', zh:'🇨🇳', ja:'🇯🇵', ru:'🇷🇺', ca:'🏴', eu:'🏴', gl:'🏴', nl:'🇳🇱', pl:'🇵🇱'};
function banderaIdioma(c){
  const d = idiomasPropios[c];
  return (d && d.bandera) || BANDERAS[c] || '🌐';
}
function nombreIdioma(c){
  if (c === 'es') return 'Español';
  if (c === 'en') return 'English';
  const d = idiomasPropios[c];
  return (d && d.nombre) || c;
}
function idiomasDisponibles(){ return IDIOMAS_BASE.concat(Object.keys(idiomasPropios || {})); }

/* Importar desde un archivo elegido por la persona. */
/* ---- Reconocimiento automático del tipo de archivo ----
   La app maneja varios formatos: copias de seguridad, idiomas, prácticas en texto
   o Word. En vez de obligar a acertar con el botón, se mira el contenido y se
   encamina solo: así un archivo de Moment se importa desde cualquier sitio. */
function tipoDeArchivo(texto, nombre){
  const n=(nombre||'').toLowerCase();
  if(/\.docx$/.test(n)) return 'docx';
  let d=null;
  try{ d=JSON.parse(texto); }catch(e){ d=null; }
  if(d && typeof d==='object'){
    if(d.app==='momento-para-ti' || d.app==='moment' || d.data) return 'copia';
    if(d.codigo && (d.interfaz || d.practicas)) return 'idioma';
    if(Array.isArray(d) && d.length && d[0] && d[0].title) return 'practicas';
    if(Array.isArray(d.practicas)) return 'practicas';
    return 'json-desconocido';
  }
  if(/^\s*(t[ií]tulo|title)\s*:/im.test(texto)) return 'practicas';
  return 'desconocido';
}
/* ---- Archivos de Moment encontrados en el móvil ----
   Busca en la carpeta Descargas los archivos que la app sabe usar y los ofrece
   para importar con un toque, sin tener que buscarlos a mano. Solo lee archivos
   pequeños cuyo nombre encaja: no rastrea el teléfono. */
let archivosDetectados = [];
async function buscarArchivosMoment(){
  archivosDetectados = [];
  try{
    if(!CapAjustes || !CapAjustes.listarArchivosMoment) return [];
    const r = await CapAjustes.listarArchivosMoment();
    (r && r.archivos || []).forEach(a=>{
      let texto='';
      try{ texto = decodeURIComponent(escape(atob(a.base64))); }catch(e){ return; }
      const tipo = tipoDeArchivo(texto, a.nombre);
      if(tipo==='copia' || tipo==='idioma' || tipo==='practicas')
        archivosDetectados.push({nombre:a.nombre, fecha:a.fecha, tipo, texto});
    });
  }catch(e){ anota('buscar-archivos', e); }
  return archivosDetectados;
}
function nombreTipo(t){
  return t==='copia' ? t('im_t_copia') : t==='idioma' ? t('im_t_idioma') : t('im_t_practicas');
}
async function renderDetectados(){
  const el=document.getElementById('detectados'); if(!el) return;
  el.innerHTML = `<p class="muted" style="font-size:.85rem">${t('im_scanning')}</p>`;
  const lista = await buscarArchivosMoment();
  if(!lista.length){ el.innerHTML = `<p class="muted" style="font-size:.85rem">${t('im_none')}</p>`; return; }
  el.innerHTML = lista.map((a,i)=>`<div class="row" style="align-items:center;margin:0 0 6px">
    <div style="flex:1">
      <b style="font-size:.9rem">${esc(a.nombre)}</b><br>
      <span class="muted" style="font-size:.78rem">${esc(nombreTipo(a.tipo))}</span>
    </div>
    <button class="btn small ghost" onclick="importarDetectado(${i})">${t('im_use')}</button>
  </div>`).join('');
}
function importarDetectado(i){
  const a = archivosDetectados[i]; if(!a) return;
  if(a.tipo==='idioma') aplicarIdiomaTexto(a.texto);
  else importarDatosTexto(a.texto);
}

/* Punto único de importación: acepta cualquier archivo de Moment. */
function importarArchivo(file){
  if(!file) return;
  const r=new FileReader();
  r.onerror=()=>toast(t('bk_read_fail'));
  r.onload=()=>{
    const texto=String(r.result||'');
    const tipo=tipoDeArchivo(texto, file.name);
    if(tipo==='idioma'){ aplicarIdiomaTexto(texto); return; }
    if(tipo==='copia' || tipo==='practicas'){ importarDatosTexto(texto); return; }
    toast(t('im_unknown'));
    anota('importar', new Error('tipo no reconocido: '+tipo));
  };
  r.readAsText(file);
}
function aplicarIdiomaTexto(texto){
  {
    let d = null;
    try{ d = JSON.parse(texto); }
    catch(e){ toast(t('id_bad')); anota('importar-idioma', e); return; }
    const fallos = revisarIdioma(d);
    if (fallos.length){ alert(t('id_rejected') + '\n\n· ' + fallos.join('\n· ')); return; }
    const total = PRACTICAS.length;
    const hechas = Object.keys(d.practicas || {}).length;
    if (!confirm(t('id_confirm')
        .replace('{n}', d.nombre || d.codigo)
        .replace('{p}', hechas + '/' + total)
        .replace('{a}', d.autor || '—'))) return;
    idiomasPropios[d.codigo] = d;
    LS.set('mpt_idiomas', idiomasPropios);
    activarIdioma(d);
    olvidarPrefijos();
    setLang(d.codigo);
    toast(t('id_added').replace('{n}', d.nombre || d.codigo));
    renderSet();
  }
}
function quitarIdioma(c){
  if (!confirm(t('id_remove_q').replace('{n}', nombreIdioma(c)))) return;
  delete idiomasPropios[c];
  LS.set('mpt_idiomas', idiomasPropios);
  if (getLang() === c) setLang('es');
  toast(t('id_removed'));
  setTimeout(()=>{ try{ location.reload(); }catch(e){} }, 700);
}

/* Créditos de traducción del idioma activo, si los hay. */
function creditoIdioma(l){
  try{ return (typeof CREDITOS!=='undefined' && CREDITOS[l || getLang()]) || ''; }
  catch(e){ return ''; }
}
function langRespaldo(){
  const l = (cfg && cfg.langBiblio) || 'es';
  return (l === 'en') ? 'en' : 'es';
}
function refreshPracticesLang(){
  try{
    const l = getLang();
    // si el idioma activo tiene su propia lista lista, se usa tal cual;
    // si no, se construye rellenando con el idioma de respaldo
    if(l === 'es') PRACTICES = PRACTICES_ES;
    else if(l === 'en') PRACTICES = PRACTICES_EN;
    else PRACTICES = construirPracticas(l, langRespaldo());
  }catch(e){ anota('idioma-biblioteca', e); }
  try{ libCacheDirty(); }catch(e){}
}
/* ¿Está completa la traducción de la biblioteca en el idioma activo? */
function traduccionCompleta(lang){
  try{
    const t = TEXTOS[lang || getLang()];
    if(!t) return false;
    return PRACTICAS.every(p => t[p.id] && t[p.id].t);
  }catch(e){ return true; }
}
/* Si al idioma activo le faltan prácticas y aún no se ha elegido respaldo, se
   pregunta UNA vez. Después se cambia en Ajustes. */
function avisarRespaldo(){
  try{
    if(!cfg || cfg.langBiblioPreg) return;
    const l = getLang();
    if(l === 'es' || l === 'en') return;      // los idiomas de dentro están completos
    if(traduccionCompleta(l)) return;
    cfg.langBiblioPreg = true; LS.set('mpt_cfg', cfg);
    document.getElementById('modalContent').innerHTML = `
      <h3>${t('lb_ask_title')}</h3>
      <p class="muted" style="line-height:1.55">${t('lb_ask_txt')}</p>
      <button class="btn primary block" onclick="elegirRespaldo('es')">Español</button>
      <button class="btn primary block" onclick="elegirRespaldo('en')">English</button>`;
    openModal();
  }catch(e){ anota('aviso-respaldo', e); }
}
function elegirRespaldo(l){
  if(!cfg) return;
  cfg.langBiblio = (l === 'en') ? 'en' : 'es';
  LS.set('mpt_cfg', cfg);
  refreshPracticesLang();
  closeModal();
  toast(t('lb_set').replace('{l}', l === 'en' ? 'English' : 'Español'));
}
function esCatConst(c){ return c==='constelaciones'||c==='Constellations'; }
// La práctica de visualización diaria vive ahora en Introspección: se localiza por
// su id fijo (VIS_ID, definido en practices.js), no por categoría.
function practicaVis(){ try{ return byId(VIS_ID) || null; }catch(e){ return null; } }
// El canal de alarma de Android se creó con el idioma del sistema; aquí se renombra
// según el idioma elegido dentro de la app, para que Ajustes > Notificaciones coincida.
/* ---- Datos técnicos del dispositivo (solo para diagnóstico) ----
   Se piden al sistema por la vía nativa, que da modelo y versión exactos. Si no
   está disponible (web, o APK antiguo), se deduce del navegador. Ninguno de estos
   datos identifica a la persona ni sale del móvil: viajan solo si el usuario
   decide enviar el correo, y los ve escritos antes de mandarlo. */
async function datosDispositivo(){
  const d={};
  try{
    if(typeof CapAjustes!=='undefined' && CapAjustes && CapAjustes.infoDispositivo){
      const r=await CapAjustes.infoDispositivo();
      if(r){
        d.movil=[r.fabricante, r.modelo].filter(Boolean).join(' ');
        if(r.dispositivo && r.dispositivo!==r.modelo) d.movil+=' ('+r.dispositivo+')';
        d.android=r.android ? ('Android '+r.android+(r.sdk?' · API '+r.sdk:'')) : null;
        d.pantalla=r.pantalla ? (r.pantalla+(r.densidad?' @'+r.densidad+'x':'')) : null;
        d.canal=r.canalAlarma||null;
        if(typeof r.bateriaExenta==='boolean') d.bateria=r.bateriaExenta?t('dv_batt_free'):t('dv_batt_saving');
        if(typeof r.nomolestar==='number') d.nomolestar=(r.nomolestar===1?t('dv_dnd_off'):t('dv_dnd_on'));
      }
    }
  }catch(e){}
  // respaldo desde el navegador
  try{
    const ua=navigator.userAgent||'';
    if(!d.movil){
      const m=ua.match(/Android[^;]*;\s*([^)]+?)(?:\s+Build\/|\))/);
      d.movil=(m&&m[1].trim())||null;
    }
    if(!d.android){ const a=ua.match(/Android\s+([\d.]+)/); if(a) d.android='Android '+a[1]; }
    if(!d.pantalla && screen && screen.width) d.pantalla=screen.width+'x'+screen.height;
  }catch(e){}
  return d;
}
// Bloque legible que se añade al final del correo, a la vista del usuario
async function bloqueDiagnostico(){
  const d=await datosDispositivo();
  const l=[];
  l.push(t('dv_title'));
  if(d.movil) l.push(t('dv_phone')+': '+d.movil);
  if(d.android) l.push(t('dv_os')+': '+d.android);
  if(d.pantalla) l.push(t('dv_screen')+': '+d.pantalla);
  l.push(t('dv_app')+': v'+APP_VERSION+(IS_NATIVE?' (Android)':' (web)'));
  l.push(t('dv_lang')+': '+(getLang()==='en'?'English':'Español')+
         ' · '+t('dv_sys')+': '+((navigator.languages&&navigator.languages[0])||navigator.language||'?'));
  try{ l.push(t('dv_notif')+': '+(notifOn?t('dv_on'):t('dv_off'))+
              (IS_NATIVE?(' · '+t('dv_mode')+' '+(alarmMode?t('dv_alarm'):t('dv_normal'))):'')); }catch(e){}
  if(d.canal) l.push(t('dv_chan')+': '+d.canal);
  if(d.bateria) l.push(t('dv_batt')+': '+d.bateria);
  if(d.nomolestar) l.push(t('dv_dnd')+': '+d.nomolestar);
  try{ l.push(t('dv_pattern')+': '+t('dv_start')+' '+pad(cfg.startH)+':'+pad(cfg.startM)+
              ' · '+t('dv_each')+' '+cfg.freq+' h · '+cfg.span+' '+t('dv_active')); }catch(e){}
  if(_log.length){ l.push(''); l.push('— ' + t('lg_label') + ' —'); l.push(logTexto()); }
  l.push('');
  l.push(t('dv_note'));
  return l.join('\n');
}
// Abre el correo de sugerencias con el bloque técnico ya escrito y visible
async function enviarFeedback(){
  let cuerpo='';
  try{ cuerpo=t('dv_write')+'\n\n\n\n'+await bloqueDiagnostico(); }
  catch(e){ cuerpo=t('dv_write')+'\n\n'; }
  location.href='mailto:'+METRICS_EMAIL+'?subject='+encodeURIComponent(t('st_feedback_subj'))
    +'&body='+encodeURIComponent(cuerpo);
}
function sincronizarCanal(intento){
  try{
    const plug = (typeof CapAjustes!=='undefined' && CapAjustes) ? CapAjustes : null;
    if(plug && plug.renombrarCanal){
      plug.renombrarCanal({nombre:t('canal_nombre'), descripcion:t('canal_desc')}).catch(e=>anota('renombrar-canal', e));
      return;
    }
    // El plugin aún no está listo (o el canal no existe todavía): se reintenta
    // un par de veces. Sin esto, el nombre se quedaba con el idioma del sistema.
    const n=(intento||0);
    if(n<3) setTimeout(()=>sincronizarCanal(n+1), 800*(n+1));
  }catch(e){}
}
function totalCats(){ try{ return new Set(PRACTICES.map(p=>p.cat)).size; }catch(e){ return 19; } }
// El idioma del documento afecta a la tipografía que elige el sistema y al sentido
// de lectura. Se actualiza al cambiar de idioma, no solo al cargar.
const IDIOMAS_RTL = ['ar','he','fa','ur'];
function aplicarIdiomaDocumento(){

    const l=getLang();

// ¿Hay una copia del APK dentro de la app para poder compartirla?
// Antes esto DESCARGABA el archivo entero (más de 10 MB) solo para mirar su tamaño,
// y además lo hacía en cada arranque. Ahora se pregunta solo por la cabecera y la
// comprobación se hace la primera vez que se necesita, no al abrir la app.
async function checkApkAsset(){
  try{
    if(typeof fetch!=='function') return;
    const base=(location.origin&&location.origin!=='null')?location.origin+location.pathname.replace(/[^/]*$/,''):'./';
    let r=null;
    try{ r=await fetch(base+APK_ASSET, {method:'HEAD', cache:'no-store'}); }catch(e){}
    if(r && r.ok){
      const n=parseInt(r.headers.get('content-length')||'0', 10);
      // si el servidor no informa del tamaño, basta con que el archivo exista
      apkAssetOk = n ? n>500000 : true;
      return;
    }
    // algunos entornos no admiten HEAD: se pide solo el primer byte
    const g=await fetch(base+APK_ASSET, {cache:'no-store', headers:{Range:'bytes=0-0'}});
    apkAssetOk = !!(g && (g.ok || g.status===206));
  }catch(e){ apkAssetOk=false; anota('apk-incrustado', e); }
}

// pantalla: si no, al plegar una caja larga el contenido "salta" y se pierde el hilo.
function verCaja(sel){
  // Coloca el elemento indicado en la parte alta de la pantalla.
  // Sin animación a propósito: con desplazamiento suave, el segundo cálculo se hacía
  // mientras la página aún se movía y el resultado se pasaba de largo.
  const objetivo=()=>{
    try{
      let el=typeof sel==='string' ? document.querySelector(sel) : sel;
      if(!el) return null;
      // se sube a la tarjeta contenedora, para ver su borde superior y su título
      if(el.closest){ el=el.closest('.card, .ditem') || el; }
      // La cabecera de la app es pegajosa (position:sticky) y se queda fija arriba:
      // hay que descontar su altura o taparía justo el inicio de la caja.
      let tapa=0;
      const h=document.querySelector('header.top');
      if(h){ const r=h.getBoundingClientRect(); if(r.top<=1) tapa=r.height; }
      return Math.max(0, el.getBoundingClientRect().top + window.scrollY - tapa - 10);
    }catch(e){ return null; }
  };
  const ir=()=>{ const y=objetivo(); if(y!==null) window.scrollTo(0, y); };
  requestAnimationFrame(()=>requestAnimationFrame(ir));
  setTimeout(ir, 120);   // por si el contenido cambió de alto al desplegarse
  setTimeout(ir, 320);
}

const CFG_VERSION = 7;

  { v:6, aplica(c){ if(!c.catsPref) c.catsPref={}; } },
  // v7: las categorías preferidas se guardaban con el nombre en español
  // («Armonización»); ahora se guardan con el código («armonizacion»).

function migrarCfg(){
  if(!cfg) return;

  MIGRACIONES.forEach(m=>{ if(m.v>desde){ m.aplica(cfg); cambia=true; } });

function statsDay(){
  const d=todayStr();
  if(!stats.days[d]) stats.days[d]={h:0, ps:[], pv:0, hor:{}, camb:{}, extra:0};
  if(stats.days[d].extra===undefined) stats.days[d].extra=0;
  // poda: solo se conservan 30 días
  const lim=new Date(); lim.setDate(lim.getDate()-30);
  const limS=dateStrOf(lim);
  Object.keys(stats.days).forEach(k=>{ if(k<limS) delete stats.days[k]; });

function statDone(marcada, pid, extra){
  const d=statsDay();
  const log=LS.get('mpt_donelog', {});
  if(marcada){
    if(extra) d.extra++; else d.h++;
    stats.lastDone=Date.now();
    if(pid) log[pid]=(log[pid]||0)+1;
  } else {
    if(extra) d.extra=Math.max(0,d.extra-1); else d.h=Math.max(0,d.h-1);
    if(pid && log[pid]) { log[pid]--; if(log[pid]<=0) delete log[pid]; }

function statsResumen(){
  const dias=Object.keys(stats.days).sort();
  let h=0, pPract=0, pVeces=0, extra=0; const hor={}, camb={};
  dias.forEach(k=>{
    const d=stats.days[k];

    Object.entries(d.hor).forEach(([hh,n])=>hor[hh]=(hor[hh]||0)+n);
    Object.entries(d.camb).forEach(([pid,n])=>camb[pid]=(camb[pid]||0)+n);

function saveEvent(){
  const hh=document.getElementById('ev_h').value;
  const sel=document.getElementById('ev_p').value;
  const rep=document.getElementById('ev_r').value;
  const n=parseInt(document.getElementById('ev_n').value)||2;
  // límite de repeticiones
  let veces=0;
  const selV=document.getElementById('ev_veces');
  if(selV && document.getElementById('ev_r').value!=='once'){
    veces = selV.value==='otro'
      ? Math.max(0, parseInt(document.getElementById('ev_veces_n').value||'0',10)||0)
      : (parseInt(selV.value,10)||0);
  }
  // pauta de repetición DENTRO del día
  const dmode=document.getElementById('ev_dm').value;
  const dcount=parseInt(document.getElementById('ev_dc').value)||1;
  const dgap=parseInt(document.getElementById('ev_dg').value)||1;
  const dtimes=[...document.querySelectorAll('.ev_dt')].map(i=>i.value)
    .filter(v=>v).map(v=>{ const [a,b]=v.split(':').map(Number); return a*60+b; });
  if(dmode==='list' && !dtimes.length){ toast(t('ev_need_times')); return; }
  if(!hh){ toast(t('ev_pick_hour')); return; }
  let pid=sel, t;
  if(sel==='__new__'){
    const xt=(document.getElementById('ev_xt').value||'').trim();
    const x=(document.getElementById('ev_x').value||'').trim();
    const l=(document.getElementById('ev_l').value||'').trim();
    if(!xt){ toast(t('ev_title_req')); return; }
    if(!x && !l){ toast(t('ev_text_req')); return; }
    const p={id:'u'+Date.now(), cat:catSelectValue('ev_c','ev_c_new'), title:xt, text:x||t('default_link_text')};
    if(l) p.link=l;
    userLib.push(p); LS.set('mpt_userlib', userLib); libCacheDirty();
    pid=p.id;
    t=xt;
  } else {
    // práctica elegida de la lista: el título del momento es el de esa práctica
    const pp=byId(sel);
    if(!pp){ toast(t('ev_pick_ex')); return; }
    t=pp.title;
  }
  const [H,M]=hh.split(':').map(Number);
  let ev;
  if(editingEvent){
    ev=getEvent(editingEvent);
    if(!ev){ closeModal(); return; }
    Object.assign(ev, {title:t, time:H*60+M, pid, rep, n, dmode, dcount, dgap, dtimes});
    // se retiran las ocurrencias pendientes de hoy y se recoloca si toca hoy
    ensureDayPlan();
    dayState.plan=dayState.plan.filter(sl=>!(sl.ev===ev.id && !sl.done));
  } else {
    const now=new Date();
    ev={id:'e'+Date.now(), title:t, time:H*60+M, pid, rep, n, veces, dmode, dcount, dgap, dtimes,
      startY:now.getFullYear(), startM:now.getMonth()+1, startD:now.getDate()};
    userEvents.push(ev);
    ensureDayPlan();
  }
  LS.set('mpt_events', userEvents);
  const horasHoy=eventOccurrences(todayStr()).filter(o=>o.ev.id===ev.id).map(o=>o.time);
  if(horasHoy.length){
    horasHoy.forEach(m=>dayState.plan.push({time:m, pid:ev.pid, ev:ev.id, done:false, snoozes:0, snoozeUntil:null}));
    dayState.plan.sort((a,b)=>a.time-b.time);
    if(!dayState.used.includes(ev.pid)) dayState.used.push(ev.pid);
  }
  const era=editingEvent;
  const esNuevoEjercicio=(sel==='__new__');
  // Se pregunta cuando el momento pisa alguna propuesta PREDEFINIDA del patrón: es la
  // única elección real. Los momentos propios (este u otros) se conservan siempre.
  const hayConflicto = evChocaPatron(ev).length>0 && !(cfg && cfg.soloEventos);
  finalizarEvento(ev, era, esNuevoEjercicio, pid, hayConflicto?'preguntar':'ambas');
}
// ¿el choque afecta a más de una hora? (para elegir los textos en singular o plural)
function _cfPlural(ev){ return evChocaPatron(ev).length>1; }
// modo: 'preguntar' (modal sustituir/ambas), 'sustituir', 'ambas'
function finalizarEvento(ev, era, esNuevoEjercicio, pid, modo){
  if(modo==='preguntar'){
    const eraArg = era ? ("'"+era+"'") : 'null';
    document.getElementById('modalContent').innerHTML=
      '<h3>'+t('cf_title')+'</h3>'+
      (function(){
        const choca=evChocaPatron(ev);
        const uno=choca.length<=1;
        return '<p class="muted">'+(uno?t('cf_at'):t('cf_at_pl'))+' <b>'+
          (choca.length?choca.map(fmtT).join(', '):fmtT(ev.time%1440))+'</b> '+(uno?t('cf_body'):t('cf_body_pl'))+'</p>';
      })()+
      '<button class="btn primary block" style="margin-bottom:8px" onclick="finalizarEvento(getEvent(\''+ev.id+'\'), '+eraArg+', '+esNuevoEjercicio+', \''+pid+'\', \'sustituir\')">'+(_cfPlural(ev)?t('cf_replace_pl'):t('cf_replace'))+'</button>'+
      '<button class="btn ghost block" onclick="finalizarEvento(getEvent(\''+ev.id+'\'), '+eraArg+', '+esNuevoEjercicio+', \''+pid+'\', \'ambas\')">'+(_cfPlural(ev)?t('cf_both_pl'):t('cf_both'))+'</button>';
    openModal();
    return;
  }
  // La decisión se guarda EN EL MOMENTO, no solo en el día de hoy: así se respeta
  // también mañana y cada vez que el plan se reconstruya.
  if(modo==='sustituir' || modo==='ambas'){
    ev.excl = (modo==='sustituir');
    const g=getEvent(ev.id); if(g) g.excl=ev.excl;
    LS.set('mpt_events', userEvents);
  }
  if(modo==='sustituir' && dayState){
    // se retiran SOLO las propuestas predefinidas (las que no son momento propio).
    // Todos los momentos creados por el usuario se conservan.
    const horas=new Set(eventOccurrences(todayStr()).filter(o=>o.ev.id===ev.id).map(o=>o.time));
    dayState.plan=dayState.plan.filter(sl=>!(horas.has(sl.time) && !sl.ev && !sl.done));
    dayState.plan.sort((a,b)=>a.time-b.time);
  }
  saveDay();
  LS.set('mpt_plans', {});  // invalida el caché de días futuros → se reconstruyen con el momento nuevo
  scheduleNext();
  editingEvent=null;
  closeModal(); renderSet();
  toast(t('ev_saved')+' '+(era?t('ev_updated'):t('ev_created'))+' ✔ · '+evTimesText(ev)+' · '+repFullText(ev));
  if(!era && esNuevoEjercicio){
    const p=byId(pid);
    if(p) ofrecerEnviarPractica(p);
  }
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  // respaldo para WebView: textarea temporal + execCommand
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

// Si el aviso corresponde a una franja de hoy, se marca esa franja (cuenta como
// normal la primera vez); si no, se registra como práctica extra.
function nativeDoneFromNotif(ex){
  ensureDayPlan();
  const s=(ex && ex.d===0 && dayState.plan[ex.idx])?dayState.plan[ex.idx]:null;
  if(s && s.pid===ex.pid && !s.done){
    toggleDone(ex.idx);
  } else if(ex && ex.pid){
    const i=dayState.plan.findIndex(sl=>sl.pid===ex.pid && !sl.done && eff(sl)<=nowMins());
    if(i>=0) toggleDone(i);
    else { statDoneExtra(ex.pid); toast(t('extra_done')); }
  }
  saveDay(); scheduleNext(); startWatch();
  if(!document.hidden && tab==='home') renderHome();
}
async function nativeSnoozeFromNotif(ex){
  ensureDayPlan();
  const s=(ex.d===0 && dayState.plan[ex.idx])?dayState.plan[ex.idx]:null;
  if(s && s.pid===ex.pid && !s.done){
    s.notified=false;
    snooze(ex.idx);            // aplica la secuencia Fibonacci y reprograma el sistema
    return;
  }
  const n=(ex.snoozes||0);
  if(n>=FIB_INC.length){ toast(t('ts_no_snooze')); return; }
  const p=byId(ex.pid); if(!p) return;
  const canal=await canalActual();
  CapLN.schedule({notifications:[{
    id: 90000+Math.floor(Math.random()*9000),
    title:t('app_title'), body:p.title+' — '+p.text.slice(0,80)+'…',
    channelId:canal, actionTypeId:'MPT',
    schedule:{at:new Date(Date.now()+FIB_INC[n]*60000), allowWhileIdle:true},
    extra:{...ex, snoozes:n+1}
  }]}).catch(()=>{});
  toast(t('ts_snoozed').replace('{m}', FIB_INC[n]));
}

function doneByPid(id){
  ensureDayPlan();
  const i=dayState.plan.findIndex(s=>s.pid===id && !s.done && eff(s)<=nowMins());
  if(i>=0){ toggleDone(i); }
  else { statDoneExtra(id); toast(t('extra_done')); }
  if(!document.hidden && tab==='home') renderHome();
}
function snoozeByPid(id){
  ensureDayPlan();
  const i=dayState.plan.findIndex(s=>s.pid===id && !s.done);
  if(i<0){ toast(t('ts_not_pending')); return; }
  snooze(i);
  if(!document.hidden && tab==='home') renderHome();
}

let _shown=false;
function _forceShow(){
  if(_shown) return; _shown=true;
  const splash=document.getElementById('splash');
  const app=document.getElementById('app');
  // si venimos de una notificación, la splash se retira al instante (sin fundido) para ir directos a la práctica
  if(splash){
    if(fromNotif || snoozeParam || doneParam){ try{splash.remove();}catch(e){} }
    else { splash.classList.add('out'); setTimeout(()=>{ try{splash.remove();}catch(e){} },500); }
  }
  document.body.classList.remove('loading');
  if(app) app.classList.remove('hidden');
  try{ start(); }
  catch(e){
    // Si el arranque normal falla, se muestra un aviso en vez de quedar en blanco
    const m=document.getElementById('main');
    if(m) m.innerHTML='<div class="card"><h2>'+t('err_title')+'</h2><p class="muted">'+t('err_body')+'</p><button class="btn primary block" onclick="try{location.reload()}catch(e){}">'+t('err_retry')+'</button></div>';
    try{ document.getElementById('nav').classList.remove('hidden'); }catch(e2){}
  }
}
function boot(){
  try{
    try{ applyNavLang(); }catch(e){}
    try{ refreshPracticesLang(); }catch(e){}
    try{ sincronizarCanal(); }catch(e){}
    setTimeout(()=>{ try{ avisarRespaldo(); }catch(e){} }, 2600);
    if(!LS.get('mpt_install',0)) LS.set('mpt_install', Date.now());
    if(LS.get('mpt_ver','')!==String(APP_VERSION)){ LS.set('mpt_ver', String(APP_VERSION)); LS.set('mpt_update', Date.now()); }
    // La portada es la ÚNICA pantalla de inicio y se muestra siempre 2 segundos.
    // Solo se salta al venir de un aviso, para ir directos a la práctica.
    if(fromNotif){ _forceShow(); }
    else setTimeout(_forceShow, 2000);
  }catch(e){ _forceShow(); }
  // RED DE SEGURIDAD: pase lo que pase, a los 3,5 s la splash se retira SIEMPRE
  setTimeout(_forceShow, 3500);
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    // app oculta: se apagan los temporizadores para no gastar batería en segundo plano
    // (el sistema de Android ya tiene los avisos programados; no se pierde nada)
    stopWatch();
  } else if(cfg){ ensureDayPlan(); startWatch(); if(tab==='home') renderHome(); }
});
function start(){
  if(!cfg){ ob._langDone=!!LS.get('mpt_lang',null); renderOnboarding(ob._langDone?0:'lang'); return; }
  // Con la app ya configurada, sin aceptación activa TODO queda bloqueado
  if(!aceptado()){ renderAceptacion('bloqueo'); return; }
  document.getElementById('nav').classList.remove('hidden');
  try{ ensureDayPlan(); }
  catch(e){
    // dato corrupto de una versión anterior: se regenera el plan del día
    try{ LS.remove('mpt_day'); LS.set('mpt_plans', {}); dayState=null; ensureDayPlan(); }
    catch(e2){ dayState={date:todayStr(), used:[], plan:[]}; }
  }
  try{ statOpen(); }catch(e){}
  try{ startWatch(); }catch(e){}
  if(IS_NATIVE){
    setTimeout(async()=>{
      try{
        const r=await CapLN.checkPermissions(); nativePerm=r.display;
        try{ const x=await CapLN.checkExactNotificationSetting(); exactPerm=x.exact_alarm; }catch(e){}
        if(nativePerm==='granted'){
          const pend=await CapLN.getPending();
          if(!pend.notifications || pend.notifications.length===0) pedirReprogramacion();
        }
      }catch(e){}
    }, 1200);
  }
  // propuesta de envío de métricas cada 3 días. El aplazamiento se guarda en su
  // propia clave (mpt_statsRemind): así sobrevive aunque las estadísticas se
  // reinicien o se restaure una copia, y cancelar da SIEMPRE 3 días de silencio.
  setTimeout(()=>{
    const base=Math.max(stats.lastSend||0, LS.get('mpt_statsRemind',0), LS.get('mpt_install',0));
    if(Date.now()-base >= METRICS_CADA_DIAS*24*60*60*1000){
      LS.set('mpt_statsRemind', Date.now());
      if(confirm(t('st_remind_q').replace('{d}', METRICS_CADA_DIAS))) sendMetrics();
    }
  }, 2500);
  history.replaceState({app:1},''); history.pushState({app:1},''); // colchón para el botón atrás
  if(doneParam){ history.replaceState({app:1},'',location.pathname); doneByPid(doneParam); gotoTab('home'); return; }
  if(snoozeParam){ history.replaceState({app:1},'',location.pathname); snoozeByPid(snoozeParam); gotoTab('home'); return; }
  if(fromNotif){ history.replaceState({app:1},'',location.pathname); pushView({type:'tab', tab:'home'}); openFullPractice(fromNotif, true); return; }
  try{ gotoTab('home'); }catch(e){ try{ document.getElementById('main').innerHTML='<div class=\"card\"><p class=\"muted\">'+t('boot_loaded')+'</p></div>'; }catch(e2){} }
  tryOpenPending();
  setTimeout(tryOpenPending, 900); // por si la notificación llega un instante después
}

/* ---- Pila de vistas: el botón atrás del teléfono navega dentro de la app, nunca sale ---- */
let viewStack=[];
function navActive(t){ document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t)); }
function renderView(v){
  if(v.type==='tab'){ tab=v.tab; navActive(v.tab); ({home:renderHome, lib:renderLib, fav:renderFav, set:renderSet})[v.tab](); }
  else { renderFullPractice(v.id, v.origin||'day'); }
  window.scrollTo(0,0);
}
function pushView(v){
  const top=viewStack[viewStack.length-1];
  if(top && top.type===v.type && top.tab===v.tab && top.id===v.id) { renderView(v); return; }
  viewStack.push(v); renderView(v);
}
// Botón atrás: primero cierra un pop-up abierto; si no, retrocede dentro de la app.
// Definición única, compartida por la ruta nativa (Capacitor) y la web (popstate).
function atrasApp(){
  const modal=document.getElementById('modal');
  if(modalOpen || (modal && !modal.classList.contains('hidden'))){ closeModal(); return true; }
  if(viewStack.length>1){ viewStack.pop(); renderView(viewStack[viewStack.length-1]); return true; }
  return false;   // no había nada que cerrar ni a donde volver
}
window.addEventListener('popstate', ()=>{
  atrasApp();
  history.pushState({app:1},''); // atrapa el atrás: para salir se usa el botón de inicio del teléfono
});
function gotoTab(t){ tab=t; pushView({type:'tab', tab:t}); }
function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  // cuanto más largo el mensaje, más tiempo en pantalla (entre 2,6 y 7 segundos)
  const ms=Math.min(7000, Math.max(2600, 1200 + String(msg).length*55));
  setTimeout(()=>el.remove(), ms);
}

let ob = { startH:7, startM:0, freq:3, span:12 };

function clockSVG(h,m,size){
  size = size || 230; const c=size/2, r=c-8;
  let ticks='', nums='';
  for(let i=0;i<60;i++){
    const a=(i*6-90)*Math.PI/180, big=i%5===0;
    const r1=r-(big?14:7), x1=c+r1*Math.cos(a), y1=c+r1*Math.sin(a);
    const x2=c+r*Math.cos(a), y2=c+r*Math.sin(a);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#3A3127" stroke-width="${big?2.4:1}"/>`;
  }
  for(let n=1;n<=12;n++){
    const a=(n*30-90)*Math.PI/180, rr=r-30;
    nums+=`<text x="${(c+rr*Math.cos(a)).toFixed(1)}" y="${(c+rr*Math.sin(a)).toFixed(1)}" font-size="${size*0.082}" font-weight="600" fill="#2B241C" text-anchor="middle" dominant-baseline="central">${n}</text>`;
  }
  const ha=((h%12)+m/60)*30-90, ma=m*6-90;
  const hx=c+(r*0.48)*Math.cos(ha*Math.PI/180), hy=c+(r*0.48)*Math.sin(ha*Math.PI/180);
  const mx=c+(r*0.72)*Math.cos(ma*Math.PI/180), my=c+(r*0.72)*Math.sin(ma*Math.PI/180);
  return `<svg class="clockface" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="#FFFDF7" stroke="#B08D3E" stroke-width="5"/>
    ${ticks}${nums}
    <line x1="${c}" y1="${c}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#2B241C" stroke-width="6" stroke-linecap="round"/>
    <line x1="${c}" y1="${c}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#B08D3E" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${c}" cy="${c}" r="7" fill="#B08D3E" stroke="#2B241C" stroke-width="2"/>
  </svg>`;
}

/* ---- Reloj táctil: una esfera para la hora y otra igual para los minutos ---- */
// caraReloj('h'|'m', valorSel, tamaño, cbNombre): esfera con números pulsables.
// Horas: anillo exterior 1-12, anillo interior 13-00. Minutos: 00 a 55, de 5 en 5.
function caraReloj(fase, sel, size, cbNombre){
  size=size||250; const c=size/2, r=c-8;
  let el=`<circle cx="${c}" cy="${c}" r="${r}" fill="#FFFDF7" stroke="#B08D3E" stroke-width="5"/>`;
  const num=(x,y,txt,val,act,fs)=>`<g onclick="${cbNombre}(${val})" style="cursor:pointer">
    <circle cx="${x}" cy="${y}" r="${fs*1.15}" fill="${act?'#B08D3E':'transparent'}"/>
    <text x="${x}" y="${y}" font-size="${fs}" font-weight="600" fill="${act?'#FFFDF7':'#2B241C'}" text-anchor="middle" dominant-baseline="central">${txt}</text></g>`;
  if(fase==='h'){
    for(let n=1;n<=12;n++){
      const a=(n*30-90)*Math.PI/180;
      el+=num(c+(r-24)*Math.cos(a), c+(r-24)*Math.sin(a), n, n, sel===n, size*0.072);
    }
    for(let k=1;k<=12;k++){
      const v=(k+12)%24;  // 13..23 y 00
      const a=(k*30-90)*Math.PI/180;
      el+=num(c+(r-62)*Math.cos(a), c+(r-62)*Math.sin(a), pad(v), v, sel===v, size*0.058);
    }
  } else {
    for(let k=0;k<12;k++){
      const v=k*5, a=(k*30-90)*Math.PI/180;
      el+=num(c+(r-26)*Math.cos(a), c+(r-26)*Math.sin(a), pad(v), v, sel===v, size*0.068);
    }
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${el}</svg>`;
}
// Selector genérico en su propia capa (funciona también sobre un modal abierto)
let _rp={cb:null, h:9, m:0, fase:'h'};
function abrirReloj(mins, cb){
  _rp={cb, h:Math.floor(mins/60)%24, m:(mins%60)-((mins%60)%5), fase:'h'};
  let ov=document.getElementById('relojov');
  if(!ov){ ov=document.createElement('div'); ov.id='relojov';
    ov.style.cssText='position:fixed;inset:0;background:rgba(43,36,28,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
    ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });
    document.body.appendChild(ov);
  }
  _pintarReloj();
}
function _pintarReloj(){
  const ov=document.getElementById('relojov'); if(!ov) return;
  ov.innerHTML=`<div style="background:var(--crema);border-radius:18px;padding:18px;text-align:center;max-width:320px;width:100%">
    <div style="font-size:1.7rem;font-weight:700;margin-bottom:6px">
      <span style="${_rp.fase==='h'?'color:var(--dorado)':''}">${pad(_rp.h)}</span>:<span style="${_rp.fase==='m'?'color:var(--dorado)':''}">${pad(_rp.m)}</span>
    </div>
    <p class="muted" style="margin:0 0 8px">${_rp.fase==='h'?t('clk_pick_h'):t('clk_pick_m')}</p>
    ${caraReloj(_rp.fase, _rp.fase==='h'?_rp.h:_rp.m, 250, '_relojTap')}
  </div>`;
}
function _relojTap(v){
  if(_rp.fase==='h'){ _rp.h=v; _rp.fase='m'; _pintarReloj(); }
  else{
    _rp.m=v;
    const ov=document.getElementById('relojov'); if(ov) ov.remove();
    if(_rp.cb) _rp.cb(_rp.h*60+_rp.m);
  }
}
// Botón estándar que muestra la hora y abre el reloj; escribe en un input oculto
function botonHora(idInput, mins, clase){
  const v=(typeof mins==='number')?pad(Math.floor(mins/60))+':'+pad(mins%60):'';
  return `<input type="hidden" id="${idInput}" ${clase?`class="${clase}"`:''} value="${v}">`+
    `<button type="button" class="btn ghost" style="width:100%;font-size:1.15rem;font-weight:700" `+
    `onclick="(function(b){const i=document.getElementById('${idInput}');const [h,m]=(i.value||'09:00').split(':').map(Number);`+
    `abrirReloj(h*60+m, mm=>{ i.value=pad(Math.floor(mm/60))+':'+pad(mm%60); b.textContent='🕐 '+i.value; });})(this)">🕐 ${v||'--:--'}</button>`;
}

function askNotif(){

function toggleNotif(after){

function chime(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.9);
    o.frequency.exponentialRampToValueAtTime(1318,ctx.currentTime+0.15);
    o.start(); o.stop(ctx.currentTime+1);
  }catch(e){}
}

/* ================== PLAN DEL DÍA ================== */
function slotTimes(){
  // los tiempos pueden superar las 24 h (p. ej. 25:30 = 01:30 de la madrugada);
  // así los momentos de después de medianoche ordenan y clasifican correctamente
  const t0=cfg.startH*60+cfg.startM, out=[];
  for(let t=t0; t<=t0+cfg.span*60; t+=cfg.freq*60) out.push(t);
  return out;
}
function pickPractices(n, exclude){
  // favoritas al día: las que el usuario definió con la barra (0..máximo de momentos).
  // Si pide más de las que tiene, los huecos se completan con propuestas aleatorias;
  // si tiene más de las pedidas, se eligen al azar entre sus favoritas.
  const excl=new Set(exclude||[]);
  const favPool=favs.filter(id=>{
    if(!byId(id) || excl.has(id) || paused.includes(id)) return false;
    if((cfg.constNo || anyConstFlag()) && esCatConst((byId(id)||{}).cat)) return false;
    return true;
  });
  const objetivo=Math.min(n, Math.max(0, (cfg && cfg.favPerDay!==undefined)?cfg.favPerDay:1));
  const nFav=Math.min(objetivo, favPool.length);
  const chosen=[];
  shuffle(favPool);
  for(let i=0;i<nFav;i++){ chosen.push(favPool[i]); excl.add(favPool[i]); }
  const rest=ALL().map(p=>p.id).filter(id=>{
    if(excl.has(id) || favs.includes(id) || paused.includes(id)) return false;
    if((cfg.constNo || anyConstFlag()) && esCatConst((byId(id)||{}).cat)) return false;
    return true;
  });
  shuffle(rest);
  while(chosen.length<n && rest.length) { const id=rest.pop(); chosen.push(id); excl.add(id); }
  shuffle(chosen);
  return placeVisualization(placeCategoryPrefs(placeConstellations(chosen)));
}
// Pares de categorías (nombre canónico ES ↔ etiqueta EN), en orden de aparición
// Duraciones ofrecidas en "Horas de propuestas al día": múltiplos del intervalo
// elegido en "Propuesta cada", para que la última propuesta caiga siempre en hora.
function spanOpciones(){
  const f=(cfg && cfg.freq)||1, out=[];
  for(let h=f; h<=24; h+=f) out.push(h);
  return out;
}
// Ajusta el periodo activo al intervalo (se llama al cambiar "Propuesta cada")
function ajustarSpan(){
  const ops=spanOpciones(); if(!ops.length) return;
  if(!ops.includes(cfg.span)){
    // se elige la opción válida más cercana a la que tenía
    cfg.span=ops.reduce((a,b)=>Math.abs(b-cfg.span)<Math.abs(a-cfg.span)?b:a, ops[0]);
  }
}
// Etiqueta visible de una categoría. La práctica guarda un CÓDIGO
// ('armonizacion'); aquí se traduce al idioma activo. Las categorías que crea la
// persona usuaria no están en CATEGORIAS: se muestran tal cual las escribió.
function catLabel(cod){
  const c = (typeof CATEGORIAS!=='undefined') && CATEGORIAS.find(x=>x.id===cod);
  if(!c) return cod || '';
  return getLang()==='en' ? c.en : c.es;
}
// Lista de categorías para los ajustes: las oficiales y luego las propias.
function catPairs(){
  const out = (typeof CATEGORIAS!=='undefined' ? CATEGORIAS : []).map(c=>({id:c.id, es:c.es, en:c.en}));
  const oficiales = new Set(out.map(o=>o.id));
  userLib.forEach(p=>{
    if(!p.cat || oficiales.has(p.cat)) return;
    oficiales.add(p.cat);
    out.push({id:p.cat, es:p.cat, en:p.cat, propia:true});
  });
  return out;
}
// Marca o desmarca una categoría preferida. Crea catsPref si faltara (instalaciones
// que se configuraron antes de que existiera este ajuste).
function setCatPref(cat, on){
  if(!cfg) return;
  if(!cfg.catsPref) cfg.catsPref={};
  if(on) cfg.catsPref[cat]=true; else delete cfg.catsPref[cat];
  applyCfg();
}
// Prácticas "especiales": pensadas para una hora fija del día. La lista vive en
// practices.js (ESPECIALES) para que siga siendo válida si cambia la numeración.
function especialesLista(){
  try{
    if(typeof ESPECIALES==='undefined') return [];
    return ESPECIALES.map(id=>byId(id)).filter(Boolean);
  }catch(e){ return []; }
}
function catCanonOf(pid){
  const i=PRACTICES_ES.findIndex(p=>p.id===pid);
  if(i>=0) return PRACTICES_ES[i].cat;
  const u=userLib.find(p=>p.id===pid);       // práctica propia: su categoría tal cual
  return u ? u.cat : null;
}
// Categorías preferidas: garantiza al menos una práctica de cada categoría marcada,
// igual que la visualización diaria, ocupando huecos libres del patrón
function placeCategoryPrefs(ids){
  if(!cfg || !cfg.catsPref || !ids.length) return ids;
  const prefs=catPairs().filter(cp=>cfg.catsPref[cp.id] && cp.id!=='constelaciones');
  if(!prefs.length) return ids;
  const franjas=franjasConstelacion(ids.length);
  prefs.forEach(cp=>{
    if(ids.some(id=>catCanonOf(id)===cp.id)) return;   // ya hay una de esa categoría
    const cand=ids.map((_,k)=>k).filter(k=>!franjas.has(k) && !favs.includes(ids[k]) && ids[k]!==VIS_ID);
    if(!cand.length) return;
    const pool=ALL().filter(p=>p.cat===cp.id && !ids.includes(p.id) && !paused.includes(p.id)).map(p=>p.id);
    if(!pool.length) return;
    const k=cand[Math.floor(Math.random()*cand.length)];
    ids[k]=pool[Math.floor(Math.random()*pool.length)];
  });
  return ids;
}
// Índices del día reservados a constelaciones, según los ajustes del usuario.
// Única definición: la usan tanto la visualización diaria como las categorías preferidas.
function franjasConstelacion(n){
  const f=new Set();
  if(!cfg) return f;
  if(cfg.constIni) f.add(0);
  if(cfg.constMed) f.add(Math.floor((n-1)/2));
  if(cfg.constFin) f.add(n-1);
  return f;
}
// Si el usuario lo activa, la visualización del día entra una vez, en un hueco libre
function placeVisualization(ids){
  if(!cfg || !cfg.visDia || !ids.length) return ids;
  const vis=practicaVis();
  if(!vis || paused.includes(vis.id) || ids.includes(vis.id)) return ids;
  const franjas=franjasConstelacion(ids.length);
  let cand=ids.map((id,k)=>k).filter(k=>!franjas.has(k) && !favs.includes(ids[k]));
  if(!cand.length) cand=ids.map((id,k)=>k).filter(k=>!franjas.has(k));
  if(!cand.length) return ids;
  ids[cand[Math.floor(Math.random()*cand.length)]]=vis.id;
  return ids;
}
function anyConstFlag(){ return cfg && (cfg.constIni || cfg.constMed || cfg.constFin); }

/* ---- Momentos propios: ocurrencias por fecha y construcción del día completo ---- */
function getEvent(id){ return userEvents.find(e=>e.id===id); }
function eventsFor(dstr){
  const [y,m,dd]=dstr.split('-').map(Number);
  const date=new Date(y,m-1,dd);
  return userEvents.filter(ev=>{
    if(evPaused.includes(ev.id)) return false;
    const sd=new Date(ev.startY, ev.startM-1, ev.startD);
    const diff=Math.round((date-sd)/(24*60*60*1000));
    if(diff<0) return false;
    // ¿Toca hoy, según la frecuencia?
    let toca, vuelta;   // vuelta = qué repetición es esta, empezando en 0
    if(ev.rep==='daily'){ toca=true; vuelta=diff; }
    else if(ev.rep==='days'){ toca = ev.n>0 && diff%ev.n===0; vuelta = ev.n>0 ? Math.floor(diff/ev.n) : 0; }
    else if(ev.rep==='weekly'){ toca = date.getDay()===sd.getDay(); vuelta = Math.floor(diff/7); }
    else if(ev.rep==='monthly'){
      toca = date.getDate()===sd.getDate();
      vuelta = (date.getFullYear()-sd.getFullYear())*12 + (date.getMonth()-sd.getMonth());
    }
    else { toca = diff===0; vuelta = 0; }
    if(!toca) return false;
    // Límite de repeticiones: probar algo durante 7, 21 días… y que se apague solo.
    // Sin ev.veces (o 0) se repite indefinidamente, como hasta ahora.
    if(ev.veces>0 && vuelta>=ev.veces) return false;
    return true;
  });
}
// Horas a las que ocurre un momento propio dentro de un mismo día.
// dmode: 'int' = n veces cada x horas · 'list' = horas concretas · ausente = una sola vez
// Minutos "crudos" desde la medianoche del día en que arranca la tanda. Pueden
// superar 1439: esas repeticiones NO se descartan, saltan al día siguiente.
// Los duplicados tampoco se descartan: se resuelven preguntando al usuario.
function eventTimes(ev){
  if(!ev) return [];
  let ts;
  if(ev.dmode==='list' && Array.isArray(ev.dtimes) && ev.dtimes.length){
    ts=[ev.time].concat(ev.dtimes);
  } else if(ev.dmode==='int' && ev.dcount>1 && ev.dgap>0){
    ts=[];
    for(let k=0;k<ev.dcount;k++) ts.push(ev.time + k*ev.dgap*60);
  } else ts=[ev.time];
  return ts.filter(m=>typeof m==='number' && m>=0).sort((a,b)=>a-b);
}
// Cuántos días abarca la tanda más larga (para buscar arrastres de días anteriores)
function maxSpillDays(){
  let mx=0;
  userEvents.forEach(ev=>{ const r=eventTimes(ev); const u=r[r.length-1]||0; if(u>mx) mx=u; });
  return Math.min(7, Math.floor(mx/1440));
}
// Ocurrencias reales de los momentos propios en una fecha: las que empiezan ese día
// más las arrastradas desde días anteriores por pasar de medianoche.
function eventOccurrences(dstr){
  const [y,m,dd]=dstr.split('-').map(Number);
  const base=new Date(y,m-1,dd);
  const out=[];
  for(let k=0;k<=maxSpillDays();k++){
    const ref=new Date(base.getFullYear(), base.getMonth(), base.getDate()-k);
    eventsFor(dateStrOf(ref)).forEach(ev=>{
      eventTimes(ev).forEach(raw=>{
        if(Math.floor(raw/1440)===k) out.push({ev, time: raw%1440});
      });
    });
  }
  return out.sort((a,b)=>a.time-b.time);
}
// Horas del momento tal como se muestran, marcando las que caen en días siguientes
// Horas del patrón estándar que quedan pisadas por un momento propio.
// Se compara contra slotTimes(), que es igual todos los días: así la detección
// vale para hoy y para cualquier día futuro.
function evChocaPatron(ev){
  const patron=slotTimes().map(m=>m%1440);
  return [...new Set(eventTimes(ev).map(m=>m%1440).filter(m=>patron.includes(m)))].sort((a,b)=>a-b);
}
// Horas en las que algún momento propio pidió quedarse solo (ev.excl)
function horasExclusivas(dstr){
  return new Set(eventOccurrences(dstr).filter(o=>o.ev && o.ev.excl).map(o=>o.time));
}
function evTimesText(ev){
  return eventTimes(ev).map(m=>{
    const d=Math.floor(m/1440);
    return fmtT(m%1440)+(d?' (+'+d+')':'');
  }).join(' · ');
}
function repText(ev){
  const dias=[t('wd_sun'),t('wd_mon'),t('wd_tue'),t('wd_wed'),t('wd_thu'),t('wd_fri'),t('wd_sat')];
  if(ev.rep==='daily') return t('rep_daily');
  if(ev.rep==='days') return t('rep_days_a')+' '+ev.n+' '+t('rep_days_b');
  if(ev.rep==='weekly'){ const sd=new Date(ev.startY,ev.startM-1,ev.startD); return t('rep_weekly')+' '+dias[sd.getDay()]; }
  if(ev.rep==='monthly') return t('rep_monthly_a')+' '+ev.startD+t('rep_monthly_b');
  return '';
}
// Texto del patrón completo: repetición entre días + repetición dentro del día
function repFullText(ev){
  const base=repText(ev) + (ev.veces>0 ? ' · '+t('ev_total').replace('{n}', ev.veces) : '');
  const n=eventTimes(ev).length;
  if(n<=1) return base;
  if(ev.dmode==='int') return base+' · '+n+' '+t('rep_ntimes')+' ('+t('rep_each')+' '+ev.dgap+' h)';
  return base+' · '+n+' '+t('rep_ntimes');
}
// Día completo: momentos del patrón + momentos propios, ordenados por hora
function buildDayEntries(dstr){
  const occ=eventOccurrences(dstr);
  // modo "solo mis momentos": el día lo forman únicamente los momentos propios.
  // Si ese día no hay ninguno, el día queda vacío: es lo que el usuario ha pedido.
  if(cfg && cfg.soloEventos){
    return occ.map(o=>({time:o.time, pid:o.ev.pid, ev:o.ev.id}));
  }
  const times=slotTimes();
  const ids=pickPractices(times.length, occ.map(o=>o.ev.pid));
  // las horas donde un momento propio pidió quedarse solo pierden la propuesta del patrón
  const excl=horasExclusivas(dstr);
  const entries=times.map((t,i)=>({time:t, pid:ids[i]||null})).filter(e=>!excl.has(e.time%1440));
  occ.forEach(o=>entries.push({time:o.time, pid:o.ev.pid, ev:o.ev.id}));
  entries.sort((a,b)=>a.time-b.time);
  return entries;
}
// Coloca una constelación al principio, al mediodía y/o al final del día según lo elegido
function placeConstellations(ids){
  if(cfg.constNo || !anyConstFlag() || !ids.length) return ids;
  const n=ids.length, pos=new Set();
  if(cfg.constIni) pos.add(0);
  if(cfg.constMed) pos.add(Math.floor((n-1)/2));
  if(cfg.constFin) pos.add(n-1);
  const usados=new Set(ids);
  const favConst=favs.filter(id=>esCatConst((byId(id)||{}).cat) && !usados.has(id) && !paused.includes(id));
  const otras=PRACTICES.filter(p=>esCatConst(p.cat) && !usados.has(p.id) && !favConst.includes(p.id) && !paused.includes(p.id)).map(p=>p.id);
  shuffle(favConst); shuffle(otras);
  // pop() toma primero del final: favoritas al final = favoritas primero
  const pool=[...otras, ...favConst];
  [...pos].forEach(i=>{
    const c=pool.pop();
    if(!c) return;
    // si en esta franja cayó una favorita normal, se recoloca en otro hueco antes
    if(favs.includes(ids[i])){
      const j=ids.findIndex((id,k)=>!pos.has(k) && !favs.includes(id));
      if(j>=0){ const tmp=ids[j]; ids[j]=ids[i]; ids[i]=tmp; }
    }
    usados.delete(ids[i]); ids[i]=c; usados.add(c);
  });
  return ids;
}
// sustituciones puntuales ("nueva recomendación"): aleatoria pura entre todas
function pickRandom(exclude){
  const excl=new Set(exclude||[]);
  const pool=ALL().map(p=>p.id).filter(id=>{
    if(excl.has(id) || paused.includes(id)) return false;
    if(cfg && cfg.constNo && esCatConst((byId(id)||{}).cat)) return false;
    return true;
  });
  return pool.length? pool[Math.floor(Math.random()*pool.length)] : null;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

function ensureDayPlan(){
  if(dayState && dayState.date===todayStr()) return;
  const plans=LS.get('mpt_plans', {});
  const pre=plans[todayStr()];
  // usa el plan pregenerado (coincide con lo ya programado en el sistema) o construye uno
  const entries=(pre && pre.length && pre[0] && pre[0].pid!==undefined) ? pre : buildDayEntries(todayStr());
  Object.keys(plans).forEach(k=>{ if(k<=todayStr()) delete plans[k]; });
  LS.set('mpt_plans', plans);
  dayState={date:todayStr(), used:[...new Set(entries.map(e=>e.pid))],
    plan: entries.map(e=>({time:e.time, pid:e.pid, ev:e.ev, done:false, snoozes:0, snoozeUntil:null}))};
  LS.set('mpt_day', dayState);
}
function saveDay(){ LS.set('mpt_day', dayState); }
// Reconstruye el plan de hoy inmediatamente (tras crear/pausar/borrar momentos) para que
// el patrón estándar rellene los huecos al instante, sin dejar la agenda vacía
function rebuildToday(){

  // (crear, pausar, borrar, activar "solo mis momentos") se propagan a toda la agenda

  ensureDayPlan();
}

let tickTimer=null;
let diaTimer=null;      // despierta una vez al día, en la medianoche
let reschedTimer=null;  // agrupa varias reprogramaciones seguidas en una sola
const eff = s => s.snoozeUntil!==null ? s.snoozeUntil : s.time;

/* ---- Plan de días futuros (para programar el sistema por adelantado) ---- */
function getPlanFor(dstr){
  if(dstr===todayStr()){ ensureDayPlan(); return dayState.plan.map(s=>({time:s.time, pid:s.pid, ev:s.ev})); }
  const plans=LS.get('mpt_plans', {});

  plans[dstr]=plan;

  return plan;
}
/* Cancela todo y entrega al sistema de Android los próximos 7 días de avisos.
   Estos suenan a su hora aunque la app esté completamente cerrada. */
// Canal correcto para programar avisos. Si el modo alarma está activo pero el canal
// aún no aparece (arranque en frío: el nativo lo crea en paralelo), se reintenta hasta
// 2 segundos antes de rendirse. Esto evita que las primeras notificaciones tras abrir
// la app salgan por el canal normal en vez del de alarma.
async function canalActual(){
  if(!alarmMode) return 'momento';
  if(alarmChannelOk!==true){
    try{ await checkAlarmChannel(); }catch(e){}
    for(let i=0;i<4 && alarmChannelOk!==true;i++){
      await new Promise(r=>setTimeout(r,500));
      try{ await checkAlarmChannel(); }catch(e){}
    }
  }
  return (alarmChannelOk===true)?'momento_despertador':'momento';
}
async function nativeReschedule(){
  if(!IS_NATIVE) return;
  try{ await CapLN.createChannel({id:'momento', name:t('canal_std_nombre'), description:t('canal_std_desc'), importance:5, visibility:1, vibration:true}); }catch(e){}
  try{
    const pend=await CapLN.getPending();
    if(pend.notifications && pend.notifications.length){
      await CapLN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    }
  }catch(e){}
  if(!notifOn || nativePerm!=='granted') return;
  const canal=await canalActual();   // faltaba: sin esto la reprogramación fallaba entera
  const now=new Date(), list=[];
  for(let d=0; d<DAYS_AHEAD; d++){
    const day=new Date(now.getFullYear(), now.getMonth(), now.getDate()+d);
    const plan=getPlanFor(dateStrOf(day));
    plan.forEach((s,idx)=>{
      let mins=s.time;
      if(d===0){
        const slot=dayState.plan[idx];
        if(!slot || slot.done || slot.notified || slot.muted) return;
        if(slot.snoozeUntil!==null) mins=slot.snoozeUntil;
      } else if(s.muted) return;
      const at=new Date(day.getFullYear(), day.getMonth(), day.getDate(), Math.floor(mins/60), mins%60, 0);
      if(at<=now) return;
      const p=byId(s.pid); if(!p) return;
      const evd=s.ev?getEvent(s.ev):null;
      list.push({
        id:(d+1)*1000+idx,
        title:t('app_title'),
        body:(evd?evd.title+': ':'')+p.title+' — '+p.text.slice(0,70)+'…',
        schedule:{at, allowWhileIdle:true},
        channelId:canal, actionTypeId:'MPT',
        extra:{pid:s.pid, d, idx, snoozes:(d===0 && dayState.plan[idx])?dayState.plan[idx].snoozes:0}
      });
    });
  }
  if(list.length){
    try{ await CapLN.schedule({notifications:list}); }
    catch(e){
      // Android 12+ sin permiso de alarmas exactas puede rechazar la programación:
      // se reintenta en modo compatible (puede retrasarse unos minutos, pero llega)
      try{
        const compat=list.map(n=>({...n, schedule:{at:n.schedule.at}}));
        await CapLN.schedule({notifications:compat});
      }catch(e2){}
    }
  }
  LS.set('mpt_lastProg', Date.now());
}
/* Cambios puntuales: hecha o pospuesta solo tocan SU notificación en el sistema,
   sin reprogramar la planificación general de los 7 días. */
function nativeCancelSlot(idx){
  if(!IS_NATIVE) return;
  CapLN.cancel({notifications:[{id:1000+idx}]}).catch(()=>{});
}
async function nativeScheduleSlot(idx){
  if(!IS_NATIVE) return;
  CapLN.cancel({notifications:[{id:1000+idx}]}).catch(()=>{});
  if(!notifOn || nativePerm!=='granted') return;
  const s=dayState.plan[idx]; if(!s || s.done || s.muted) return;
  const p=byId(s.pid); if(!p) return;
  const mins=eff(s);
  const now=new Date();
  const at=new Date(now.getFullYear(), now.getMonth(), now.getDate(), Math.floor(mins/60), mins%60, 0);
  if(at<=now) at.setTime(Date.now()+30000);
  const canal=await canalActual();
  const nn={id:1000+idx, title:t('app_title'), body:p.title+' — '+p.text.slice(0,80)+'…',
    channelId:canal, actionTypeId:'MPT',
    schedule:{at, allowWhileIdle:true},
    extra:{pid:s.pid, d:0, idx, snoozes:s.snoozes}};
  CapLN.schedule({notifications:[nn]}).catch(()=>{
    CapLN.schedule({notifications:[{...nn, schedule:{at}}]}).catch(()=>{});
  });
}
/* Recarga silenciosa: en cualquier despertar de la app (abrirla, volver del segundo
   plano, o tocar un botón de una notificación), si han pasado RECARGA_DIAS desde la
   última programación, se renuevan los 7 días de avisos sin intervención del usuario. */
function checkRecharge(){
  if(!IS_NATIVE || !cfg || !notifOn || nativePerm!=='granted') return;
  const last=LS.get('mpt_lastProg', 0);
  if(Date.now()-last >= RECARGA_DIAS*24*60*60*1000) pedirReprogramacion();
}
// Puerta única a la reprogramación nativa. Agrupa las peticiones que llegan
// seguidas (marcar varias prácticas, cambiar ajustes, arrancar) en una sola
// operación: cancelar y volver a programar decenas de avisos es lo más caro que
// hace la app en el sistema.
function pedirReprogramacion(){
  if(!IS_NATIVE) return;
  clearTimeout(reschedTimer);
  reschedTimer=setTimeout(()=>{ reschedTimer=null; nativeReschedule(); }, 700);
}

/* startWatch: vigilancia ligera al abrir/volver a la app. NO reprograma el sistema.
   scheduleNext: reprogramación completa. Se llama SOLO cuando algo cambia de verdad:
   una práctica (hecha, pospuesta, sustituida) o el patrón (hora de inicio, intervalo,
   periodo activo, interruptor de notificaciones). */
function stopWatch(){
  clearInterval(tickTimer); clearTimeout(notifTimer); clearTimeout(diaTimer);
  tickTimer=null; notifTimer=null; diaTimer=null;
}
function startWatch(){
  stopWatch();
  if(!cfg || !dayState) return;
  if(IS_NATIVE){
    // El sistema ya tiene los avisos programados: aquí no hace falta vigilar nada
    // segundo a segundo. Basta con despertar UNA vez, en la próxima medianoche,
    // para rehacer el plan del día. Antes esto era un intervalo de 60 s: 1440
    // despertares diarios para detectar un cambio que ocurre una vez al día.
    if(dayState.date!==todayStr()) ensureDayPlan();
    checkRecharge();
    armMedianoche();
    return;
  }
  // Pulso de seguridad. La precisión la da armPrecise(), que pone un temporizador
  // exacto para el próximo momento; este solo recoge lo que se hubiera quedado atrás,
  // así que un minuto sobra y son la mitad de despertares.
  tickTimer=setInterval(tick, 60000);
  armPrecise();                        // y un temporizador exacto para el próximo momento
  tick();                              // dispara ya cualquier aviso que quedara atrasado
}
// Reprogramación agrupada: varias acciones seguidas (marcar hechas, posponer,
// cambiar ajustes) producen UNA sola reprogramación del sistema en vez de una por
// acción. Cancelar y volver a programar decenas de avisos es la operación nativa
// más costosa de la app.
function scheduleNext(){
  startWatch();
  pedirReprogramacion();
}
// Un único temporizador hasta la próxima medianoche (con 2 s de margen).
// Al dispararse, rehace el plan, refresca la pantalla si procede y se rearma.
function armMedianoche(){
  clearTimeout(diaTimer);
  const ahora=new Date();
  const manana=new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate()+1, 0, 0, 2);
  const ms=Math.max(1000, manana-ahora);
  diaTimer=setTimeout(()=>{
    if(dayState && dayState.date!==todayStr()){
      ensureDayPlan();
      if(tab==='home' && !document.hidden) renderHome();
    }
    checkRecharge();
    armMedianoche();
  }, ms);
}
function armPrecise(){
  clearTimeout(notifTimer);
  const nm=nowMins(); let best=null;
  dayState.plan.forEach(s=>{
    if(s.done || s.notified) return;
    const t=eff(s);
    if(t>nm && (best===null || t<best.t)) best={t, slot:s};
  });
  if(!best) return;
  const ms=(best.t-nm)*60*1000 - (new Date().getSeconds()*1000);
  notifTimer=setTimeout(()=>{ tick(); armPrecise(); }, Math.max(1000,ms));
}
function tick(){
  if(!cfg || !dayState) return;
  if(dayState.date!==todayStr()){ ensureDayPlan(); armPrecise(); if(tab==='home' && !document.hidden) renderHome(); return; }
  const nm=nowMins();
  // momentos cuyo tiempo ya pasó y aún no se han notificado (incluye los perdidos
  // mientras Android tenía la app congelada: se recuperan al instante)
  const perdidos=dayState.plan.filter(s=>!s.done && !s.notified && eff(s)<=nm);
  if(perdidos.length){
    perdidos.forEach(s=>s.notified=true);
    saveDay();
    fireNotification(perdidos[perdidos.length-1]); // se avisa de la más reciente, sin acumular
    if(tab==='home' && !document.hidden) renderHome();
  }
}
async function fireNotification(slot){
  if(!notifOn) return;                    // interruptor de la app
  const p=byId(slot.pid); if(!p) return;
  const body=p.title+' — '+p.text.slice(0,80)+'…';
  chime();                                // refuerzo sonoro cuando la app está viva
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    if(reg && Notification.permission==='granted'){
      reg.showNotification(t('app_title'), {
        body, icon:'icon-192.png', badge:'icon-192.png', tag:'mpt-'+p.id, renotify:true,
        data:{id:p.id}, silent:false, vibrate:[120,60,120],
        actions:[{action:'done', title:t('notif_act_done')},{action:'snooze', title:t('notif_act_snooze')},{action:'open', title:t('notif_act_open')}]
      });
      return;
    }
  }catch(e){}
  if(Notification.permission==='granted'){
    const n=new Notification(t('app_title'),{body, icon:'icon-192.png'});
    n.onclick=()=>{ window.focus(); openFullPractice(p.id); };
  }
}

function toggleDone(i){
  const s=dayState.plan[i];
  if(s.done){
    s.done=false;
    const enFuturo = eff(s) > nowMins();
    s.notified = !enFuturo;
    saveDay(); statDone(false, s.pid, s.extraDone);
    s.extraDone=false;
    if(enFuturo) nativeScheduleSlot(i);
    startWatch();
    toast(t('ts_unmarked'));
  } else {
    // ¿es la práctica del momento actual o una ya vencida y pendiente? → cuenta normal.
    // ¿es una práctica FUTURA (su hora aún no ha llegado)? → cuenta como EXTRA y se
    // regenera esa franja para que, cuando llegue su hora, se proponga una nueva sin hacer.
    const esFutura = eff(s) > nowMins();
    const esExtra = esFutura || !!s.doneOnce;
    if(esFutura){
      // registrar la extra sobre esta práctica
      statDone(true, s.pid, true);
      const pidHecha=s.pid;
      // regenerar la franja con otra práctica no usada hoy
      const fresh=pickRandom(dayState.used);
      if(fresh){
        s.pid=fresh; s.done=false; s.snoozes=0; s.snoozeUntil=null; s.notified=false; s.doneOnce=false; s.extraDone=false;
        dayState.used.push(fresh);
      } else {
        // si no queda ninguna nueva, se deja marcada como hecha normal
        s.done=true; s.extraDone=true; s.doneOnce=true;
      }
      saveDay(); scheduleNext(); startWatch();
      if(!document.hidden && tab==='home') renderHome();
      toast(t('ts_extra_done'));
      return;
    }
    s.done=true; s.snoozeUntil=null;
    // si este momento ya tuvo una hecha antes (se cambió tras completarla), esta cuenta como EXTRA
    s.extraDone = esExtra;
    s.doneOnce = true;
    saveDay(); statDone(true, s.pid, esExtra); nativeCancelSlot(i); startWatch();
    toast(esExtra ? t('ts_done_extra') : t('ts_done_ok'));
  }
}
function snooze(i){
  const s=dayState.plan[i];
  if(s.done){ toast(t('ts_already_done')); return; }
  if(s.snoozes>=FIB_INC.length){ toast(t('ts_no_snooze')); return; }
  const inc=FIB_INC[s.snoozes];
  const base=s.snoozeUntil!==null? s.snoozeUntil : Math.max(s.time, nowMins());
  let until=base+inc;
  const nxt=dayState.plan[i+1];
  if(nxt && until>=nxt.time){ s.done=true; s.snoozeUntil=null; saveDay(); nativeCancelSlot(i); startWatch(); toast(t('ts_next_sooner')); return; }
  s.snoozes++; s.snoozeUntil=until; s.notified=false;
  saveDay(); statSnooze(i); nativeScheduleSlot(i); startWatch();
  toast(t('ts_snoozed_to').replace('{m}', inc).replace('{h}', fmtT(s.snoozeUntil)));
}
function newRecommendation(i){

    statDiscard(s.pid);
    s.pid=fresh; s.done=false; s.snoozes=0; s.snoozeUntil=null; s.notified=false;

}
function togglePause(id){

/* --------- Vista de práctica a pantalla completa (con menú inferior) --------- */
function openFullPractice(id, adopt, origin){
  const p=byId(id);
  if(!p){ toast(t('ts_notif_gone')); return; }
  try{
    ensureDayPlan();
    let i=dayState.plan.findIndex(s=>s.pid===id);
    // Si viene de una notificación de hoy y no está en el plan, se asigna al momento actual
    if(i<0 && adopt){
      i=currentSlotIndex();
      Object.assign(dayState.plan[i], {pid:id, done:false, snoozes:0, snoozeUntil:null, notified:false});
      if(!dayState.used.includes(id)) dayState.used.push(id);
      saveDay(); scheduleNext();
    }
  }catch(e){ /* pase lo que pase con el plan, la práctica se muestra igualmente */ }
  pushView({type:'p', id, origin:origin||'day'});
}
function goSibling(id, origin){
  if(!id) return;
  const top=viewStack[viewStack.length-1];
  if(top && top.type==='p'){ top.id=id; top.origin=origin||top.origin; renderView(top); } else openFullPractice(id, false, origin);
}
function renderFullPractice(id, origin){
  origin=origin||'day';
  const p=byId(id); if(!p) return;
  document.getElementById('nav').classList.remove('hidden');
  let i=-1, slot=null;
  try{ ensureDayPlan(); i=dayState.plan.findIndex(s=>s.pid===id); slot=i>=0?dayState.plan[i]:null; }catch(e){}
  const isFav=favs.includes(p.id);
  const isPaused=paused.includes(p.id);
  // Anterior/Siguiente según el listado de ORIGEN
  let seq;
  if(origin==='fav') seq=favs.filter(x=>byId(x));
  else if(origin==='lib') seq=ALL().filter(x=>!paused.includes(x.id)).map(x=>x.id);
  else if(origin==='paused') seq=ALL().filter(x=>paused.includes(x.id)).map(x=>x.id);
  else seq=(i>=0)?dayState.plan.map(s=>s.pid):ALL().filter(x=>!paused.includes(x.id)).map(x=>x.id);
  const k=seq.indexOf(id);
  const prevId=k>0?seq[k-1]:null;
  const nextId=(k>=0 && k<seq.length-1)?seq[k+1]:null;
  const soloLib=(origin==='fav'||origin==='lib'||origin==='paused'); // vistas de biblioteca/favoritas
  const M=document.getElementById('main');
  M.innerHTML=`
    <div class="backbar" style="justify-content:space-between">
      <button class="btn small ghost" ${prevId?`onclick="goSibling('${prevId}','${origin}')"`:'disabled style="opacity:.35"'}>${t('fp_prev')}</button>
      <button class="btn small ghost" onclick="history.back()">${t('fp_back')}</button>
      <button class="btn small ghost" ${nextId?`onclick="goSibling('${nextId}','${origin}')"`:'disabled style="opacity:.35"'}>${t('fp_next')}</button>
    </div>
    <span class="cat-tag ${catClass(p.cat)}">${esc(catLabel(p.cat))}</span>
    <h2 style="margin:4px 0 14px;font-size:1.5rem">${esc(p.title)}</h2>
    <div class="ptext" style="font-size:1.12rem">${esc(p.text)}</div>
    ${p.link?`<a class="plink" href="${p.link}" target="_blank" rel="noopener">${t('open_ex')}</a>`:''}
    <div class="row" style="margin-top:22px">
      ${(!soloLib && slot)?`<button class="btn ${slot.done?'primary':'ghost'}" style="flex:1" onclick="toggleDone(${i});renderFullPractice('${p.id}','${origin}')">${t('done_mark')}</button>`:''}
      <button class="btn ${isFav?'terra':'ghost'}" style="flex:1" onclick="toggleFav('${p.id}');renderFullPractice('${p.id}','${origin}')">♥ ${isFav?t('fav_saved'):t('fav_save')}</button>
      ${origin==='fav'?`<button class="btn gold" style="flex:1" onclick="hacerAhora('${p.id}')">${t('done_now')}</button>`:''}
    </div>
    <button class="btn ${isPaused?'gold':'ghost'} block" onclick="togglePause('${p.id}');renderFullPractice('${p.id}','${origin}')">${isPaused?t('pause_remove'):t('pause_add')}</button>
    ${(!soloLib && slot && !slot.done)?`<button class="btn ghost block" onclick="snooze(${i});renderFullPractice('${p.id}','${origin}')">${t('fp_snooze')}</button>
    ${slot.snoozes?`<div class="snoozeinfo">${t('snoozed_pre')} ${slot.snoozes} ${slot.snoozes===1?t('snoozed_1'):t('snoozed_n')} · ${t('snoozed_next')} ${fmtT(slot.snoozeUntil)}</div>`:''}`:''}
    <button class="btn ghost block" onclick="crearMomentoDe('${p.id}')">${t('mk_moment_btn')}</button>
    ${!soloLib?`<button class="btn primary block" onclick="gotoTab('home')">${t('fp_go_app')}</button>`:''}
  `;
  window.scrollTo(0,0);
}

/* ---- Caja "Hechas" con gamificación ---- */
function hechasStats(){
  // recuento por práctica a partir de mpt_stats.days (guardamos ids al marcar hecha)
  const done=LS.get('mpt_donelog', {}); // { pid: veces }
  const total=Object.values(done).reduce((a,b)=>a+b,0);
  const cats=new Set();
  Object.keys(done).forEach(pid=>{ const p=byId(pid); if(p) cats.add(p.cat); });
  // racha de días: días consecutivos con al menos una hecha (de mpt_stats.days)
  const st=LS.get('mpt_stats',{days:{}});
  const dias=Object.keys(st.days||{}).filter(d=>st.days[d].h>0).sort();
  let racha=0, mejor=0, prev=null;
  dias.forEach(d=>{
    if(prev){ const diff=Math.round((new Date(d)-new Date(prev))/(864e5)); racha=diff===1?racha+1:1; }
    else racha=1;
    if(racha>mejor) mejor=racha;
    prev=d;
  });
  // racha actual: solo vale si el último día es hoy o ayer
  if(dias.length){ const ult=dias[dias.length-1]; const dh=Math.round((new Date(todayStr())-new Date(ult))/(864e5)); if(dh>1) racha=0; }
  else racha=0;
  return {total, cats:cats.size, racha, mejor, done};
}
function nivelSemilla(total){
  const niveles=[[0,'🌰',t('lvl_seed')],[5,'🌱',t('lvl_sprout')],[15,'🌿',t('lvl_plant')],[30,'🪴',t('lvl_rooted')],[60,'🌷',t('lvl_bloom')],[120,'🌳',t('lvl_tree')]];
  let cur=niveles[0];
  for(const n of niveles){ if(total>=n[0]) cur=n; }
  const idx=niveles.indexOf(cur);
  const sig=niveles[idx+1];
  return {emoji:cur[1], nombre:cur[2], sig:sig?sig[0]:null, sigNombre:sig?sig[2]:null};
}

    ${boxHead(`${t('lib_box_own')} (${propias.length})`, showPropias, 'showPropias', 'renderLibList()', 'expandPropiasGroup()', todos)}

function renderHechasBox(){
  const g=hechasStats();
  if(g.total===0) return '';
  const niv=nivelSemilla(g.total);
  const hechas=Object.entries(g.done).map(([pid,n])=>({p:byId(pid),n})).filter(x=>x.p && matchFiltro(x.p)).sort((a,b)=>b.n-a.n);
  const todos=hechas.every(x=>expandedHechas.has(x.p.id));
  const medallas=[];
  if(g.cats>=totalCats()) medallas.push(t('medal_explorer').replace('{n}',totalCats()));
  else medallas.push(t('medal_cats_a')+g.cats+t('medal_cats_b').replace('{n}',totalCats()));
  if(g.racha>=7) medallas.push(t('medal_streak_fire')+g.racha+(g.racha===1?t('medal_streak_day'):t('medal_streak_days')));
  else if(g.racha>=3) medallas.push(t('medal_streak_star')+g.racha+(g.racha===1?t('medal_streak_day'):t('medal_streak_days')));
  return `<div class="card anteriores" style="background:linear-gradient(180deg,#F3EDE0,#EFE7D2)">
    ${boxHead(`${t('lib_box_done')} (${g.total})`, showHechas, 'showHechas', 'renderPausedBox()', 'expandHechasGroup()', todos)}
    ${showHechas?`
      <div style="text-align:center;padding:6px 0 12px">
        <div style="font-size:2.6rem;line-height:1">${niv.emoji} <button type="button" class="tbtn suave" onclick="infoHechas()">i</button></div>
        <div style="font-weight:700;color:var(--verde2)">${niv.nombre}</div>
        <div class="muted" style="font-size:.82rem">${niv.sig?`${niv.sig-g.total} ${t('lvl_to_next_a')}${niv.sigNombre}${t('lvl_to_next_b')}`:t('lvl_max')}</div>
        <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center">
          ${medallas.map(m=>`<span class="catpill" style="background:#E8DCC0">${m}</span>`).join('')}
        </div>
        <div class="muted" style="font-size:.8rem;margin-top:8px">${t('streak_now')} <b>${g.racha}</b> ${g.racha===1?t('day_s'):t('days_s')} · ${t('streak_best')} <b>${g.mejor}</b> ${g.mejor===1?t('day_s'):t('days_s')}</div>
      </div>
      ${hechas.map(x=>ditem(x.p,'expandedHechas','renderPausedBox()',{suf:` · ${t('lib_done_n')} ${x.n} ${x.n===1?t('lib_done_1v'):t('lib_done_nv')}`, tag:false, after:''})).join('')}
    `:''}
  </div>`;
}

function toggleMute(idx, after){
  const s=dayState.plan[idx]; if(!s) return;
  s.muted=!s.muted; saveDay();
  if(s.muted){ nativeCancelSlot(idx); toast(t('notif_muted_toast')); }
  else { nativeScheduleSlot(idx); toast(t('notif_unmuted_toast')); }
  pedirReprogramacion();
  if(typeof after==='function') after();
}
// Silenciar en el plan de un día futuro (persistido en mpt_plans)
function toggleMuteNext(k, after){
  const man=new Date(); man.setDate(man.getDate()+1);
  const dstr=dateStrOf(man);
  const plans=LS.get('mpt_plans', {});
  if(!plans[dstr] || !plans[dstr][k]) return;
  plans[dstr][k].muted=!plans[dstr][k].muted;
  LS.set('mpt_plans', plans);
  toast(plans[dstr][k].muted?t('notif_muted_toast'):t('notif_unmuted_toast'));
