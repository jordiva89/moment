name: Construir APK

on:
  push:
    branches: [ main, master ]
    # Cambiar un workflow no debe disparar una compilacion: solo confunde y gasta
    # cuota. Para compilar a proposito, usar "Run workflow" desde la pestana Actions.
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
      - 'tools/auditoria/**'
  workflow_dispatch:

permissions:
  contents: write     # publicar el APK como Release
  actions: write      # borrar artefactos antiguos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install
      - name: Generar el proyecto Android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          npx cap add android
          node tools/prepare-android.js
          node tools/setup-signing.js
          npx cap sync android
      - name: Primera compilación
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      # Copia limpia, sin el APK incrustado: pesa la mitad y sirve para descartar
      # que el instalador del movil rechace un APK que contiene otro dentro.
      - name: Guardar la copia sin incrustar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/moment-basico.apk

      - name: Incluir el APK dentro de la app y recompilar
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk www/moment.apk
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      # Antes de subir el APK nuevo se borran los antiguos: si no, el almacén de
      # GitHub (500 MB en repos privados) se llena tras unas decenas de compilaciones
      # y la subida falla aunque el APK se haya construido bien.
      # El APK se publica como RELEASE: las descargas de Releases NO consumen la
      # cuota de artefactos de Actions (500 MB en repos privados), que es lo que
      # estaba bloqueando las compilaciones. Además queda un enlace permanente.
      - name: Publicar el APK como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          VER=$(node -e "const s=require('fs').readFileSync('www/index.html','utf8');console.log((s.match(/APP_VERSION = '([^']+)'/)||[,'?'])[1])")
          TAG=apk-ultimo
          cp "$APK" "moment-v$VER.apk"
          cp /tmp/moment-basico.apk "moment-v$VER-basico.apk" 2>/dev/null || true
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "moment-v$VER.apk" "moment-v$VER-basico.apk" \
            --title "APK de pruebas v$VER" \
            --notes "Compilado el $(date -u '+%Y-%m-%d %H:%M UTC'). Si el APK normal da error al instalar, prueba el que acaba en -basico." \
            --latest=false
          echo "## APK listo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Descárgalo desde **Releases → APK de pruebas v$VER**." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Hacer sitio borrando APK antiguos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conservar=2
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.created_at, .id, .size_in_bytes, .name] | @tsv' \
            | sort -r > /tmp/arts.tsv || true
          total=$(wc -l < /tmp/arts.tsv || echo 0)
          echo "Artefactos guardados: $total"
          if [ "$total" -gt "$conservar" ]; then
            tail -n +$((conservar+1)) /tmp/arts.tsv | while IFS=$'\t' read -r fecha id tam nombre; do
              echo "  borrando $nombre ($((tam/1048576)) MB, $fecha)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
            done
          fi
          echo "Listo. Se conservan los $conservar más recientes."

      # Copia adicional como artefacto. Si la cuota está llena simplemente se omite:
      # el APK ya está publicado como Release en el paso anterior.
      - name: Copia como artefacto (opcional)
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: moment-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
