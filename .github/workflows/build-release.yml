name: Release para Google Play y web

# Se lanza A MANO desde la pestaña Actions de GitHub (botón "Run workflow").
# Genera dos archivos firmados con tu clave de siempre:
#   - app-release.aab  → el que se sube a Google Play
#   - app-release.apk  → el que se publica en la web (opción B)
on:
  workflow_dispatch:

# Solo lee el código: los archivos se entregan como artefactos, no como Release.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Preparar Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Preparar Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci; else
            echo "::warning::Falta package-lock.json en el repositorio: se instalan las últimas versiones sin fijar. Súbelo para que la compilación sea reproducible."
            npm install
          fi
      - name: Pruebas automáticas
        run: npm test
      - name: Generar el proyecto Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npx cap add android
          node tools/prepare-android.js
          node tools/set-version.js
      # La clave de firma solo está disponible en este paso, no en los demás.
      - name: Firma
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tools/setup-signing.js
      - name: Copiar la app al proyecto Android
        run: npx cap sync android
      - name: Compilar AAB (Google Play) y APK (web)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          ./gradlew assembleRelease
      - name: Publicar el AAB para Google Play
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          retention-days: 5
          name: momento-para-ti-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Publicar el APK de release para la web
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          retention-days: 5
          name: momento-para-ti-web-apk
          path: android/app/build/outputs/apk/release/app-release.apk
