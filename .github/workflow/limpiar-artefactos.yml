name: Limpiar artefactos antiguos

# Libera el almacenamiento de GitHub borrando los APK de compilaciones anteriores.
# Usa la herramienta gh, que viene instalada en el runner: no depende de ninguna
# accion externa, asi que no puede romperse por cambios de version.
#
# Lanzalo a mano desde Actions cuando aparezca el error de cuota llena.
# Los APK borrados no se pierden: se regeneran recompilando.

on:
  workflow_dispatch:
    inputs:
      conservar:
        description: 'Cuantos artefactos recientes conservar (0 = borrarlos todos)'
        required: false
        default: '0'

permissions:
  actions: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar artefactos
        env:
          GH_TOKEN: ${{ github.token }}
          CONSERVAR: ${{ github.event.inputs.conservar || '0' }}
        run: |
          set -u
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.created_at, .id, .size_in_bytes, .name] | @tsv' \
            | sort -r > /tmp/arts.tsv || true

          total=$(wc -l < /tmp/arts.tsv)
          bytes=$(awk -F'\t' '{s+=$3} END {print s+0}' /tmp/arts.tsv)
          echo "Artefactos encontrados: $total"
          echo "Espacio ocupado: $((bytes/1048576)) MB"

          if [ "$total" -le "$CONSERVAR" ]; then
            echo "Nada que borrar."
            exit 0
          fi

          borrados=0
          liberado=0
          tail -n +$((CONSERVAR+1)) /tmp/arts.tsv > /tmp/borrar.tsv
          while IFS=$'\t' read -r fecha id tam nombre; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" 2>/dev/null; then
              borrados=$((borrados+1))
              liberado=$((liberado+tam))
              echo "  borrado: $nombre  ($((tam/1048576)) MB, $fecha)"
            else
              echo "  no se pudo borrar: $nombre ($id)"
            fi
          done < /tmp/borrar.tsv

          echo ""
          echo "Borrados: $borrados de $total"
          echo "Espacio liberado: $((liberado/1048576)) MB"

          {
            echo "## Limpieza de artefactos"
            echo ""
            echo "| Concepto | Valor |"
            echo "|---|---|"
            echo "| Artefactos antes | $total |"
            echo "| Espacio ocupado antes | $((bytes/1048576)) MB |"
            echo "| Borrados | $borrados |"
            echo "| Espacio liberado | $((liberado/1048576)) MB |"
            echo ""
            echo "GitHub recalcula la cuota cada 6-12 horas: si al recompilar sigue"
            echo "apareciendo el error, espera unas horas y vuelve a intentarlo."
          } >> "$GITHUB_STEP_SUMMARY"
